<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Calculator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;touch-action:manipulation}
  .view{position:fixed;inset:0;display:none}
  .view.on{display:flex}

  /* ---------- Calculator ---------- */
  #calc{align-items:flex-end;justify-content:center;background:#000}
  .calc-body{width:100%;max-width:400px;padding:16px 16px 28px}
  #display{height:110px;display:flex;align-items:flex-end;justify-content:flex-end;font-size:72px;font-weight:300;padding:0 10px 6px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .keys button{aspect-ratio:1;border:0;border-radius:999px;font-size:30px;color:#fff;background:#333;cursor:pointer;font-family:inherit;transition:filter .1s}
  .keys button:active{filter:brightness(1.5)}
  .keys .fn{background:#a5a5a5;color:#000}
  .keys .op{background:#ff9f0a;font-size:36px}
  .keys .op.sel{background:#fff;color:#ff9f0a}
  .keys .zero{grid-column:span 2;aspect-ratio:auto;text-align:left;padding-left:34px}
  .shake{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* ---------- Hub ---------- */
  #hub{flex-direction:column;background:radial-gradient(1200px 600px at 50% -10%,#1b2550 0%,#0b0e1c 55%,#07080f 100%);overflow-y:auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px;max-width:1000px;width:100%;margin:0 auto}
  .logo{font-size:22px;font-weight:800;letter-spacing:.5px}
  .logo span{color:#5ce1ff}
  .lock{border:1px solid #2c3766;background:#131935;color:#c9d3ff;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
  .lock:active{background:#1d2650}
  .sub{max-width:1000px;width:100%;margin:0 auto;padding:0 20px 14px;color:#8d98c7;font-size:14px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:6px 20px 30px;max-width:1000px;width:100%;margin:0 auto}
  a.card{display:block;text-decoration:none}
  .card{border:0;border-radius:16px;overflow:hidden;background:#141a36;color:#fff;text-align:left;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .12s}
  .card:active{transform:scale(.97)}
  .thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px}
  .card .meta{padding:10px 12px 12px}
  .card .name{font-weight:700;font-size:15px}
  .card .tag{color:#8d98c7;font-size:12px;margin-top:3px}
  .card.soon{opacity:.45;cursor:default}
  .card.soon .thumb{background:#10142a;border-bottom:1px dashed #2c3766}

  /* ---------- HTML Maker ---------- */
  #maker{flex-direction:column;background:#0b0e1c;overflow-y:auto}
  .mk{max-width:1000px;width:100%;margin:0 auto;padding:4px 20px 34px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
  #mkCode{flex:1;min-height:220px;width:100%;resize:none;background:#10142a;color:#e6ebff;border:1px solid #2c3766;border-radius:12px;padding:12px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;-webkit-user-select:text;user-select:text}
  .mkrow{display:flex;gap:10px;align-items:center}
  #mkName{flex:1;min-width:0;background:#10142a;color:#fff;border:1px solid #2c3766;border-radius:10px;padding:11px 12px;font:16px inherit;font-family:inherit}
  .ext{color:#8d98c7;font-size:16px}
  .mkbtn{border:1px solid #2c3766;background:#131935;color:#c9d3ff;border-radius:10px;padding:12px 16px;font-size:15px;font-family:inherit;cursor:pointer}
  .mkbtn.primary{flex:1;background:#5ce1ff;border-color:#5ce1ff;color:#06202a;font-weight:700}
  .mkbtn:active{filter:brightness(1.25)}
  #mkMsg{min-height:20px;color:#8d98c7;font-size:14px}

  /* ---------- Version label ---------- */
  .ver{position:fixed;left:0;right:0;bottom:3px;text-align:center;font-size:10px;letter-spacing:.5px;color:rgba(255,255,255,.45);pointer-events:none;z-index:50}
  #player .ver{position:absolute}

  /* ---------- Code list ---------- */
  #codes{flex-direction:column;background:#0b0e1c;overflow-y:auto}
  #codeList{max-width:1000px;width:100%;margin:0 auto;padding:4px 20px 30px}
  .crow{display:flex;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid #1e2750}
  .crow b{font-size:22px;font-variant-numeric:tabular-nums;color:#5ce1ff;min-width:72px}
  .crow span{color:#c9d3ff;font-size:15px}

  /* ---------- Player ---------- */
  #player{flex-direction:column;background:#07080f}
  .bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0f1430;border-bottom:1px solid #1e2750}
  .bar button{border:0;background:#1d2650;color:#fff;border-radius:9px;padding:8px 13px;font-size:14px;cursor:pointer;font-family:inherit}
  .bar .title{font-weight:700}
  #stage{flex:1;position:relative;min-height:0}
  #stage canvas,#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;touch-action:none}
</style>
</head>
<body>

<!-- Calculator (lock screen) -->
<section id="calc" class="view on">
  <div class="calc-body">
    <div id="display">0</div>
    <div class="keys" id="keys">
      <button class="fn" data-k="ac">AC</button><button class="fn" data-k="neg">+/−</button><button class="fn" data-k="pct">%</button><button class="op" data-k="/">÷</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
      <button class="zero" data-k="0">0</button><button data-k=".">.</button><button class="op" data-k="=">=</button>
    </div>
  </div>
</section>

<!-- Game hub -->
<section id="hub" class="view">
  <header>
    <div class="logo">ARCADE<span>VAULT</span></div>
    <button class="lock" id="lockBtn">Lock</button>
  </header>
  <div class="sub">Pick a game.</div>
  <div id="grid"></div>
</section>

<!-- Code list (opened with the two admin codes) -->
<section id="codes" class="view">
  <header>
    <div class="logo">ACCESS<span>CODES</span></div>
    <button class="lock" id="codesBack">Close</button>
  </header>
  <div class="sub">Type a code on the calculator, then press =.</div>
  <div id="codeList"></div>
</section>

<!-- HTML Maker (only with the everything code) -->
<section id="maker" class="view">
  <header>
    <div class="logo">HTML<span>MAKER</span></div>
    <button class="lock" id="makerBack">← Back</button>
  </header>
  <div class="sub">Paste code below, name the file, and download it as an .html file.</div>
  <div class="mk">
    <textarea id="mkCode" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Paste your code here"></textarea>
    <div class="mkrow">
      <input id="mkName" type="text" value="page" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="File name">
      <span class="ext">.html</span>
    </div>
    <div class="mkrow">
      <button id="mkSave" class="mkbtn primary">Download .html</button>
      <button id="mkClear" class="mkbtn">Clear</button>
    </div>
    <div id="mkMsg"></div>
  </div>
</section>

<!-- Game player -->
<section id="player" class="view">
  <div class="bar">
    <button id="backBtn">← Games (Esc)</button>
    <div class="title" id="gameTitle"></div>
  </div>
  <div id="stage"></div>
  <div class="ver"></div>
</section>
<div class="ver" id="verMain"></div>

<script>
/* =====================================================
   SETTINGS
   ===================================================== */
const VERSION = "22";   // shown at the bottom of every screen; bump on every update

// Game requests go to this form; the answers are collected by the form itself.
const REQUEST_FORM_URL = "https://forms.gle/m2qGqXSPpsvo3iob7";
// The form's answers land in this spreadsheet (shown only with the everything code).
const REQUEST_SHEET_URL = "https://docs.google.com/spreadsheets/d/159RO9ODZGQ_c8e6Qv5n5SWP1itSA6W_L3-fODhWJHac/edit?usp=drivesdk";

// Admin: enter ADMIN_1 then =, then ADMIN_2 then =, to see the full list of codes.
const ADMIN_1 = "0709", ADMIN_2 = "0819";

// Access codes: type one on the calculator, then press =.
// "all" opens every game; a list opens only those games (use the ids from GAMES below).
// A game marked everyone:true shows up for every code. Every new game gets its own code here,
// and the secret code list (0709 then 0819) is built from this table, so new codes appear there automatically.
const CODES = {
  "1337": "all",
  // one code per game
  "2580": ["sled"],
  "3149": ["melon"],
  "8263": ["gridiron"],
  "6157": ["chess"],
  "5472": ["soccer"],
  "4390": ["road"],
  "6638": ["dog"],
  "7315": ["escape"],
  // combos
  "4821": ["melon", "chess"],
  "7706": ["gridiron", "soccer"],
  "9034": ["sled", "soccer"],
};

/* =====================================================
   GAMES LIST — add new games here.
   Each game: { name, tag, icon, color, mount(stage) -> stop() }
   For a game hosted elsewhere, use: mount: frameGame("https://...")
   ===================================================== */
function frameGame(url, maker){
  return stage => {
    // The game itself stays on its maker's servers; this only shows their player in a frame.
    const note = document.createElement("div");
    note.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#8d98c7;font-size:15px;line-height:1.5";
    note.textContent = window.claude
      ? "This game loads from " + maker + ", and the Claude preview blocks other sites. It will load on your hosted site."
      : "Loading from " + maker + "… (needs internet)";
    stage.appendChild(note);
    if (window.claude) return () => note.remove();   // other sites can't be framed inside Claude, so don't try
    const f = document.createElement("iframe");
    f.src = url; f.allow = "fullscreen; gamepad; autoplay"; f.allowFullscreen = true; f.title = "Game from " + maker;
    f.style.background = "transparent";
    stage.appendChild(f);
    return () => { f.remove(); note.remove(); };
  };
}

const GAMES = [
  { id:"sled", name:"Sled Rush", tag:"3D downhill sledding", icon:"🛷", color:"linear-gradient(135deg,#7fd4ff,#e9f7ff)", mount:sledRush },
  { id:"melon", name:"Melon Merge", tag:"Drop & merge fruit", icon:"🍉", color:"linear-gradient(135deg,#ffe8a3,#ffb86b)", mount:melonMerge },
  { id:"gridiron", name:"Retro Gridiron", tag:"Pixel football", icon:"🏈", color:"linear-gradient(135deg,#2f9e44,#8ce99a)", mount:retroGridiron },
  { id:"chess", name:"Chess", tag:"Play against the NPC", icon:"♟️", color:"linear-gradient(135deg,#eeeed5,#7b945a)", mount:chessGame },
  { id:"soccer", name:"Pocket Soccer 3D", tag:"3D soccer vs the CPU", icon:"⚽", color:"linear-gradient(135deg,#37b24d,#d3f9d8)", mount:soccer },
  { id:"road", name:"Line Driver", tag:"Draw the route · 103 levels", icon:"🚗", color:"linear-gradient(135deg,#5aa856,#3b4048)", everyone:true, mount:lineDriver },
  { id:"dog", name:"Bone Hound", tag:"Feed, walk, dig up dino bones", icon:"🐶", color:"linear-gradient(135deg,#c58a4f,#fff3bf)", mount:boneHound },
  { id:"escape", name:"Escape Road", tag:"By AZGames · loads from azgames.io", icon:"🚓", color:"linear-gradient(135deg,#ffd43b,#e03131)", mount:frameGame("https://azgames.io/escape-road.embed","AZGames") },
];

/* =====================================================
   Calculator
   ===================================================== */
const $ = id => document.getElementById(id);
const disp = $("display");
let cur = "0", prev = null, op = null, fresh = true, typed = "", armed = false;

function show(v){
  let s = String(v);
  if (s.length > 9 && !isNaN(+s)) s = String(+(+s).toPrecision(8));
  disp.textContent = s;
  disp.style.fontSize = s.length > 7 ? Math.max(34, 72 - (s.length-7)*8) + "px" : "72px";
}
function calc(a,b,o){
  a=+a; b=+b;
  if(o==="+")return a+b; if(o==="-")return a-b; if(o==="*")return a*b;
  if(o==="/")return b===0 ? "Error" : a/b;
  return b;
}
function press(k){
  document.querySelectorAll(".op.sel").forEach(b=>b.classList.remove("sel"));
  if (/^[0-9.]$/.test(k)){
    if (fresh){ cur = k==="." ? "0." : k; fresh=false; }
    else if (k==="." && cur.includes(".")) return;
    else if (cur.replace(/[-.]/g,"").length < 9) cur = cur==="0" && k!=="." ? k : cur+k;
    typed += k;
    show(cur); return;
  }
  if (k==="ac"){ cur="0"; prev=null; op=null; fresh=true; typed=""; show(cur); return; }
  if (k==="neg"){ cur = cur.startsWith("-") ? cur.slice(1) : (cur==="0"?cur:"-"+cur); typed=""; show(cur); return; }
  if (k==="pct"){ cur = String(+cur/100); typed=""; show(cur); return; }
  if (k==="="){
    const wasArmed = armed; armed = false;
    if (op===null && wasArmed && typed===ADMIN_2){ press("ac"); showCodes(); return; }
    if (op===null && typed===ADMIN_1){ armed = true; cur="0"; fresh=true; typed=""; show(cur); return; }
    if (op===null && Object.prototype.hasOwnProperty.call(CODES, typed)){ unlock(CODES[typed]); return; }
    if (op!==null){ cur = String(calc(prev,cur,op)); prev=null; op=null; }
    fresh=true; typed=""; show(cur); return;
  }
  // operator
  if (op!==null && !fresh) cur = String(calc(prev,cur,op));
  prev = cur; op = k; fresh = true; typed = "";
  show(cur);
  const b = document.querySelector('.op[data-k="'+k+'"]'); if (b) b.classList.add("sel");
}
$("keys").addEventListener("click", e => { const b = e.target.closest("button"); if (b) press(b.dataset.k); });
document.addEventListener("keydown", e => {
  if (!$("calc").classList.contains("on")) return;
  const map = {Enter:"=", "=":"=", Escape:"ac", c:"ac", x:"*", "%":"pct"};
  const k = map[e.key] || e.key;
  if (/^[0-9.+\-*/]$/.test(k) || k==="=" || k==="ac" || k==="pct"){ e.preventDefault(); press(k); }
});

/* =====================================================
   Navigation
   ===================================================== */
let stopGame = null;
function go(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on", v.id===id));
  $("verMain").style.display = id==="player" ? "none" : "";   // the game view carries its own label so it turns with the game
  fitPlayer();
}
document.querySelectorAll(".ver").forEach(e => e.textContent = "v" + VERSION);

/* Games always run landscape. If the screen is upright, the game view is turned
   sideways, and sizes + touch positions are translated so games never notice. */
const playerEl = $("player"), stageEl = $("stage");
let rotated = false;
const origRect = Element.prototype.getBoundingClientRect;
Element.prototype.getBoundingClientRect = function(){
  if (rotated && (this===stageEl || stageEl.contains(this))){
    const w=this.clientWidth, h=this.clientHeight;
    return {left:0,top:0,x:0,y:0,right:w,bottom:h,width:w,height:h};
  }
  return origRect.call(this);
};
function fitPlayer(){
  const vw=window.innerWidth, vh=window.innerHeight;
  rotated = playerEl.classList.contains("on") && vh>vw;
  playerEl.style.cssText = rotated
    ? "left:0;top:0;right:auto;bottom:auto;width:"+vh+"px;height:"+vw+"px;transform-origin:0 0;transform:translateX("+vw+"px) rotate(90deg)"
    : "";
}
window.addEventListener("resize", fitPlayer);
["pointerdown","pointermove","pointerup","pointercancel"].forEach(type => {
  stageEl.addEventListener(type, e => {
    if (!rotated || !e.isTrusted) return;
    e.stopImmediatePropagation();
    if (type==="pointerdown") e.preventDefault();
    const R = origRect.call(stageEl);
    e.target.dispatchEvent(new PointerEvent(type, {bubbles:true, cancelable:true, pointerId:e.pointerId, pointerType:e.pointerType,
      pressure:e.pressure, buttons:e.buttons, isPrimary:e.isPrimary, clientX:e.clientY-R.top, clientY:R.right-e.clientX}));
  }, true);
});
function unlock(access){ press("ac"); buildGrid(access); go("hub"); }
function lock(){ closeGame(); go("calc"); }
function openGame(g){
  $("gameTitle").textContent = g.name;
  go("player");
  stopGame = g.mount($("stage"));
}
function closeGame(){ if (stopGame){ stopGame(); stopGame=null; } $("stage").innerHTML=""; }
function showCodes(){
  const list = $("codeList"); list.innerHTML = "";
  Object.keys(CODES).forEach(code => {
    const a = CODES[code], row = document.createElement("div"); row.className = "crow";
    const b = document.createElement("b"); b.textContent = code;
    const t = document.createElement("span");
    const extra = GAMES.filter(g => g.everyone && a!=="all" && !a.includes(g.id)).map(g => g.name);
    t.textContent = a==="all" ? "Everything" : a.map(id => (GAMES.find(g => g.id===id) || {name:id}).name).concat(extra).join(", ");
    row.appendChild(b); row.appendChild(t); list.appendChild(row);
  });
  go("codes");
}
$("codesBack").onclick = () => go("calc");
$("lockBtn").onclick = lock;
$("backBtn").onclick = () => { closeGame(); go("hub"); };
document.addEventListener("keydown", e => { if (e.key==="Escape" && $("player").classList.contains("on")){ closeGame(); go("hub"); } });

function buildGrid(access){
  const grid = $("grid"); grid.innerHTML = "";
  GAMES.filter(g => access==="all" || g.everyone || access.includes(g.id)).forEach(g => {
    const c = document.createElement("button"); c.className="card";
    c.innerHTML = '<div class="thumb" style="background:'+g.color+'">'+g.icon+'</div><div class="meta"><div class="name"></div><div class="tag"></div></div>';
    c.querySelector(".name").textContent = g.name;
    c.querySelector(".tag").textContent = g.tag;
    c.onclick = () => openGame(g);
    grid.appendChild(c);
  });
  const s = document.createElement("div"); s.className="card soon";
  s.innerHTML = '<div class="thumb">＋</div><div class="meta"><div class="name">More coming</div><div class="tag">New games soon</div></div>';
  // every code can send a game request: it opens the request form in a new tab
  const rq = document.createElement("a"); rq.className="card";
  rq.href = REQUEST_FORM_URL; rq.target = "_blank"; rq.rel = "noopener";
  rq.innerHTML = '<div class="thumb" style="background:linear-gradient(135deg,#ffd43b,#fff3bf)">💡</div><div class="meta"><div class="name">Request a Game</div><div class="tag">Opens the request form</div></div>';
  grid.appendChild(rq);
  if (access==="all"){
    // tools that only the everything code can see
    const vr = document.createElement("a"); vr.className="card";
    vr.href = REQUEST_SHEET_URL; vr.target = "_blank"; vr.rel = "noopener";
    vr.innerHTML = '<div class="thumb" style="background:linear-gradient(135deg,#b197fc,#e5dbff)">📬</div><div class="meta"><div class="name">View Requests</div><div class="tag">Opens the responses sheet</div></div>';
    grid.appendChild(vr);

    const m = document.createElement("button"); m.className="card";
    m.innerHTML = '<div class="thumb" style="background:linear-gradient(135deg,#5ce1ff,#c5f6fa)">📄</div><div class="meta"><div class="name">HTML Maker</div><div class="tag">Paste code, download .html</div></div>';
    m.onclick = () => { $("mkMsg").textContent=""; go("maker"); };
    grid.appendChild(m);
    grid.appendChild(s);
  }
}

/* =====================================================
   HTML Maker — paste code, save it as an .html file
   ===================================================== */
function makeHtml(code){
  // Already a full page? Save it exactly as pasted. Otherwise wrap it in a basic page.
  // Every file starts with <!DOCTYPE html> so phones and browsers recognise it as a web page, not text.
  if (/^\s*<!doctype/i.test(code)) return code;
  if (/<html[\s>]/i.test(code)) return '<!DOCTYPE html>\n' + code;
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Page</title>\n</head>\n<body>\n' + code + '\n</body>\n</html>\n';
}
function fileName(raw){
  let n = String(raw||"").trim().replace(/\.(html?|txt)$/i,"").replace(/[\\/:*?"<>|\x00-\x1f]/g,"").trim();
  return (n || "page").slice(0,80) + ".html";
}
async function saveHtml(){
  const msg = $("mkMsg"), code = $("mkCode").value;
  if (!code.trim()){ msg.textContent = "Paste some code first."; return; }
  const name = fileName($("mkName").value);   // always ends in .html
  const data = new Blob([makeHtml(code)], {type:"text/html"});
  msg.textContent = "Preparing " + name + "…";
  // Inside Claude the page has to ask the app to save the file; on a normal website the browser downloads it directly.
  let viaApp = null;
  try{ if (window.claude && window.claude.use) viaApp = await window.claude.use("downloads"); }catch(e){}
  if (viaApp){
    try{ await viaApp.save({filename:name, data}); msg.textContent = "Saved " + name + "."; }
    catch(e){ msg.textContent = e && e.code==="declined" ? "Download cancelled." : "Couldn't save the file here" + (e && e.message ? ": " + e.message : "."); }
    return;
  }
  try{
    const url = URL.createObjectURL(data);
    const a = document.createElement("a"); a.href = url; a.download = name; a.type = "text/html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    msg.textContent = "Downloading " + name + ".";
  }catch(e){ msg.textContent = "This browser blocked the download."; }
}
$("mkSave").onclick = saveHtml;
$("mkClear").onclick = () => { $("mkCode").value=""; $("mkMsg").textContent=""; };
$("makerBack").onclick = () => go("hub");

/* =====================================================
   GAME: Chess — you (white) against the NPC (black)
   ===================================================== */
function chessEngine(){
  let B,turn,cr,ep;
  const ND=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
  const BD=[[-1,-1],[-1,1],[1,-1],[1,1]], RD=[[-1,0],[1,0],[0,-1],[0,1]], KD=BD.concat(RD);

  }
  box(lam(0xf1f3f5),.25,.9,FZ*2+.8,-FX-.3,.45,0); box(lam(0xf1f3f5),.25,.9,FZ*2+.8,FX+.3,.45,0);

  const shadowM=bas(0x000000,.28), skinM=lam(0xffd8b5), ringM=bas(0xffd43b,1);
  const kitM={}; const kit=c=>kitM[c]||(kitM[c]=lam(c));
  function mkPlayer(shirt,shorts,ring){
    const g=new T.Group();
    const body=new T.Mesh(cylG,kit(shirt)); body.scale.set(.4,.8,.4); body.position.y=1.05; g.add(body);
    const legs=new T.Mesh(cylG,kit(shorts)); legs.scale.set(.34,.65,.34); legs.position.y=.33; g.add(legs);
    const head=new T.Mesh(ballG,skinM); head.scale.setScalar(.27); head.position.y=1.72; g.add(head);
    const nose=new T.Mesh(boxG,kit(shorts)); nose.scale.set(.5,.12,.2); nose.position.set(0,1.2,.38); g.add(nose);
    flat(discG,shadowM,0,.03,0,g).scale.setScalar(.55);

  }
  const ballM=new T.Mesh(ballG,new T.MeshLambertMaterial({color:0xffffff,flatShading:true})); ballM.scale.setScalar(BR); scene.add(ballM);
  const ballS=flat(discG,shadowM,0,.03,0);
  const ball={x:0,y:BR,z:0,vx:0,vy:0,vz:0,rx:0,rz:0};

  // teams: you + up to six teammates, and the CPU fields the same number of outfield players
  const MS=[[-8,6],[8,6],[0,-9],[-9,-5],[9,-5],[0,11]];            // teammate spots: [x, distance ahead of the ball]
  const CS=[[0,5],[-8,6],[8,6],[0,-9],[-9,-5],[9,-5],[0,11]];      // CPU spots
  let me,k1,k2,mates=[],foes=[],all=[],nMates=2;
  try{ const v=parseInt(localStorage.getItem("soccer_mates"),10); if(v>=0&&v<=MAXM) nMates=v; }catch(e){}
  function buildTeams(){
    for(const o of all) scene.remove(o.g);
    const mk=(shirt,shorts,ring,sp,dir)=>({g:mkPlayer(shirt,shorts,ring),sp,dir,x:0,z:0,vx:0,vz:0,fx:0,fz:dir,cool:0,bob:0});
    me=mk(0x1c5fd4,0xffffff,true,8.2,-1);
    mates=[]; for(let i=0;i<nMates;i++) mates.push(mk(0x1c5fd4,0xffffff,false,6.6,-1));
    foes=[]; for(let i=0;i<nMates+1;i++) foes.push(mk(0xe03131,0x212529,false,6.4,1));
    k1=mk(0xffd43b,0x1c5fd4,false,5.6,-1); k2=mk(0xff922b,0x212529,false,2.7,1);
    all=[me].concat(mates,foes,[k1,k2]);
  }

  let W=0,H=0,raf=0,last=0,alive=true,st,shown="",camX=0,camZ=8;
  const keys={}, stick={id:null,ox:0,oy:0,dx:0,dy:0};
  let kickReq=false, passReq=false, sprintId=null;

  function place(){
    const set=(o,x,z)=>{ o.x=x; o.z=z; o.vx=o.vz=0; o.fx=0; o.fz=o.dir; o.cool=0; o.bob=0; };
    set(me,0,7);
    mates.forEach((m,i)=>set(m,MS[i][0],9+(i%3)*4));
    foes.forEach((f,i)=>set(f,CS[i][0],-(7+(i?2+(i%3)*4:0))));

    ball.x=0; ball.y=BR; ball.z=0; ball.vx=ball.vy=ball.vz=0;
  }
  function newMatch(){ st={mode:"ready",t:MATCH,you:0,cpu:0,pause:0,msg:"",has:false,stam:1}; buildTeams(); place(); shown=""; }
  function setMates(n){
    n=Math.max(0,Math.min(MAXM,n)); if(n===nMates||st.mode==="play"||st.mode==="goal") return;
    nMates=n; try{ localStorage.setItem("soccer_mates",n); }catch(e){}
    newMatch();
  }
  function resize(){

    camera.aspect=W/Math.max(1,H); camera.fov=W<H?72:55; camera.updateProjectionMatrix();
  }
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  function go(o,tx,tz,dt){
    const dx=tx-o.x, dz=tz-o.z, d=Math.hypot(dx,dz);

    const v=Math.min(o.sp,d/dt); o.vx=dx/d*v; o.vz=dz/d*v;
    if(d>.3){ o.fx=dx/d; o.fz=dz/d; }
  }
  function shoot(o,dx,dz,power,lift){
    const d=Math.hypot(dx,dz)||1;
    if(st.has&&o!==me) me.cool=.5;
    st.has=false;
    ball.vx=dx/d*power; ball.vz=dz/d*power; ball.vy=lift; ball.y=Math.max(ball.y,BR+.02);
  }
  const dB=o=>Math.hypot(o.x-ball.x,o.z-ball.z), near=(o,r)=>dB(o)<r;
  const closest=list=>{ let b=null,bd=1e9; for(const o of list){ const d=dB(o); if(d<bd){bd=d;b=o;} } return b; };
  function goal(mine){
    if(mine) st.you++; else st.cpu++;
    st.has=false; st.mode="goal"; st.pause=1.8; st.msg=mine?"GOAL!":"CPU scores";
  }
  function passTo(){
    // pick the teammate that best matches the way you're facing
    let best=null,bs=-1e9;
    for(const m of mates){
      const dx=m.x-me.x, dz=m.z-me.z, d=Math.hypot(dx,dz)||1, sc=(dx*me.fx+dz*me.fz)/d-d*.02;
      if(sc>bs){ bs=sc; best=m; }
    }
    if(!best){ shoot(me,me.fx,me.fz,19,5.5); return; }
    const d=Math.hypot(best.x-me.x,best.z-me.z);
    shoot(me,best.x+best.vx*.3-ball.x,best.z+best.vz*.3-ball.z,cl(d*1.5+7,10,18),2.5);
  }
  function update(dt){
    if(st.mode==="play"){
      st.t-=dt; if(st.t<=0){ st.t=0; st.mode="final"; }
      // you
      let mx=(keys.r?1:0)-(keys.l?1:0), mz=(keys.d?1:0)-(keys.u?1:0);
      if(stick.id!==null){ mx=stick.dx; mz=stick.dy; }
      const ml=Math.hypot(mx,mz); if(ml>1){ mx/=ml; mz/=ml; }
      const fast=(keys.sprint||sprintId!==null)&&st.stam>0&&ml>.15;
      st.stam=cl(st.stam+(fast?-dt/3.5:dt/6),0,1);
      const sp=me.sp*(fast?1.45:1);
      me.vx=mx*sp; me.vz=mz*sp;
      if(ml>.15){ me.fx=mx/ml; me.fz=mz/ml; }
      const canHit=st.has||(me.cool<=0&&near(me,1.8)&&ball.y<1.6);
      if(kickReq&&canHit){ shoot(me,me.fx,me.fz,19,5.5); me.cool=.35; }
      else if(passReq&&canHit){ passTo(); me.cool=.35; }
      // teammates: nearest one goes for a loose ball, the rest hold their spots around it
      const refZ=st.has?me.z:ball.z, runner=closest(mates);
      mates.forEach((m,i)=>{
        if(m===runner&&!st.has&&(dB(m)<dB(me)+2||ball.z>4)){
          go(m,ball.x,ball.z,dt);
          if(m.cool<=0&&near(m,1.4)&&ball.y<1.2){
            if(ball.z<-6) shoot(m,(Math.random()*2-1)*3.2-ball.x,-FZ-ball.z,16,4);
            else { const d=Math.hypot(me.x-m.x,me.z-m.z); shoot(m,me.x+me.vx*.4-ball.x,me.z+me.vz*.4-ball.z,cl(d*1.6+6,9,17),2); }
            m.cool=.9;
          }
        } else go(m,cl(MS[i][0]+ball.x*.3,-FX+1,FX-1),cl(refZ-MS[i][1],-FZ+3,FZ-3),dt);
      });

      const chaser=closest(foes);

        if(f===chaser){
          if(f.z>ball.z-.3){ const sd=f.x<ball.x?-1:1; go(f,ball.x+sd*1.4,ball.z-1.3,dt); }
          else go(f,ball.x,ball.z-.7,dt);
          if(f.cool<=0&&near(f,1.5)&&f.z<ball.z&&ball.y<1.2){ shoot(f,(Math.random()*2-1)*3.2-ball.x,FZ-ball.z,15.5,4); f.cool=.9; }
        } else go(f,cl(CS[i][0]+ball.x*.3,-FX+1,FX-1),cl(ball.z+CS[i][1],-FZ+3,FZ-3),dt);
      });
      // keepers (theirs is deliberately dozy)
      for(const k of [k1,k2]){
        const s=k===k1?1:-1, dumb=k===k2, tx=dumb ? (ball.z<-6 ? ball.x*.5 : 0) : ball.x;
        go(k,cl(tx,-GW+.5,GW-.5),s*(FZ-1),dt);
        k.fx=0; k.fz=-s;
        if(k.cool<=0&&near(k,dumb?1.1:1.6)&&ball.y<(dumb?1:2)){ shoot(k,(Math.random()-.5)*1.4,-s,dumb?12:17,6); k.cool=dumb?1.5:.8; }
      }
    } else { for(const o of all){ o.vx=o.vz=0; } }
    kickReq=passReq=false;
    if(st.mode==="goal"){ st.pause-=dt; if(st.pause<=0){ place(); st.mode="play"; } }
    // move bodies, keep outfield players from overlapping
    for(const o of all){
      o.cool=Math.max(0,o.cool-dt);
      o.x=cl(o.x+o.vx*dt,-FX+.5,FX-.5); o.z=cl(o.z+o.vz*dt,-FZ+.5,FZ-.5);

    }
    const nOut=all.length-2;
    for(let i=0;i<nOut;i++) for(let j=i+1;j<nOut;j++){
      const a=all[i], b=all[j], dx=b.x-a.x, dz=b.z-a.z, d=Math.hypot(dx,dz);
      if(d<.9&&d>.001){ const k=(.9-d)/2; a.x-=dx/d*k; a.z-=dz/d*k; b.x+=dx/d*k; b.z+=dz/d*k; }
    }
    // possession: once you reach the ball it locks to your feet and turns with you
    if(st.mode!=="play") st.has=false;
    if(st.mode==="play"&&!st.has&&me.cool<=0&&ball.y<.9&&near(me,1.15)&&Math.hypot(ball.vx-me.vx,ball.vz-me.vz)<14) st.has=true;
    if(st.has){
      const k=Math.min(1,dt*18);
      ball.x+=(me.x+me.fx*.85-ball.x)*k; ball.z+=(me.z+me.fz*.85-ball.z)*k; ball.y=BR;
      ball.vx=me.vx; ball.vy=0; ball.vz=me.vz;
      for(const o of foes.concat([k2])) if(dB(o)<.95){ st.has=false; me.cool=.5; ball.vx=o.fx*7; ball.vz=o.fz*7; break; }
    }
    if(st.mode!=="ready"&&st.mode!=="final"){
      if(!st.has){ ball.vy-=22*dt; ball.x+=ball.vx*dt; ball.y+=ball.vy*dt; ball.z+=ball.vz*dt; }
      if(ball.y<BR){ ball.y=BR; ball.vy = ball.vy<-2.5 ? -ball.vy*.55 : 0; const f=Math.max(0,1-1.2*dt); ball.vx*=f; ball.vz*=f; }
      if(ball.y<1.75&&!st.has) for(const o of all){
        const dx=ball.x-o.x, dz=ball.z-o.z, d=Math.hypot(dx,dz), R=.45+BR;
        if(d<R){
          const nx=d>.001?dx/d:o.fx, nz=d>.001?dz/d:o.fz;

          const vn=(ball.vx-o.vx)*nx+(ball.vz-o.vz)*nz;
          if(vn<0){ ball.vx-=1.4*vn*nx; ball.vz-=1.4*vn*nz; }
        }
      }
      if(Math.abs(ball.x)>FX-BR){ ball.x=Math.sign(ball.x)*(FX-BR); ball.vx*=-.7; }
      if(Math.abs(ball.z)>FZ-BR){
        const inGoal=Math.abs(ball.x)<GW-BR&&ball.y<GH-BR;
        if(st.mode==="goal"||inGoal){
          if(st.mode==="play") goal(ball.z<0);
          if(Math.abs(ball.z)>FZ+1.3){ ball.z=Math.sign(ball.z)*(FZ+1.3); ball.vz=0; ball.vx*=.5; }
          if(Math.abs(ball.x)>GW-BR){ ball.x=Math.sign(ball.x)*(GW-BR); ball.vx*=-.3; }
        } else { ball.z=Math.sign(ball.z)*(FZ-BR); ball.vz*=-.7; }
      }
    }

    ball.rx+=ball.vz*dt/BR*.5; ball.rz-=ball.vx*dt/BR*.5; ballM.rotation.set(ball.rx,0,ball.rz);
    ballM.position.set(ball.x,ball.y,ball.z);
    ballS.position.set(ball.x,.03,ball.z); ballS.scale.setScalar(Math.max(.12,.36-ball.y*.04));
    const tx=(me.x*.6+ball.x*.4)*.6, tz=me.z*.6+ball.z*.4, kf=Math.min(1,dt*4);
    camX+=(tx-camX)*kf; camZ+=(tz-camZ)*kf;
    const tall=W<H;
    camera.position.set(camX,tall?16:12,camZ+(tall?13:14));
    camera.lookAt(camX,0,camZ-(tall?5:4));
  }
  function hudUpdate(){
    elStam.style.width=Math.round(st.stam*100)+"%";
    const t=Math.ceil(st.t), key=st.mode+"|"+st.you+"|"+st.cpu+"|"+t+"|"+nMates;
    if(key===shown) return; shown=key;
    elTop.textContent="YOU "+st.you+" : "+st.cpu+" CPU   "+Math.floor(t/60)+":"+String(t%60).padStart(2,"0");
    const playing=st.mode==="play"||st.mode==="goal", menu=st.mode==="ready"||st.mode==="final";
    elKick.style.display=elSprint.style.display=playing?"flex":"none";
    elPass.style.display=playing&&nMates>0?"flex":"none";
    elPick.style.display=menu?"flex":"none"; elN.textContent=nMates;
    if(st.mode==="play"){ elM.style.display="none"; return; }
    elM.style.display="flex";
    const big=x=>'<div style="font-size:30px;font-weight:800">'+x+'</div>';
    if(st.mode==="goal"){ elM.style.background="rgba(6,20,10,.25)"; elM.innerHTML=big(st.msg); return; }
    elM.style.background="rgba(6,20,10,.6)";
    const size=(nMates+2)+" v "+(nMates+2);
    elM.innerHTML = st.mode==="final"
      ? big(st.you>st.cpu?"You win!":st.you<st.cpu?"You lose":"Draw")+'<div>Final score '+st.you+' : '+st.cpu+'</div><div>Tap or press Space to play again ('+size+')</div>'
      : big("Pocket Soccer 3D")+'<div>Tap or press Space to kick off ('+size+')</div>'+
        '<div style="font-size:12px;color:#cfe8d4">You are the blue player with the yellow ring. Attack the far goal.<br>'+
        'Touch: drag to run · KICK · PASS · hold SPRINT<br>Keys: arrows/WASD · Space kick · E pass · Shift sprint · 0-6 teammates</div>';
  }
  function frame(t){
    if(!alive) return;
    const dt=Math.min(.04,(t-last)/1000||0); last=t;
    update(dt); hudUpdate(); renderer.render(scene,camera);
    raf=requestAnimationFrame(frame);
  }
  function action(){ if(st.mode==="ready") st.mode="play"; else if(st.mode==="final"){ newMatch(); st.mode="play"; } }
  const KM={arrowleft:"l",a:"l",arrowright:"r",d:"r",arrowup:"u",w:"u",arrowdown:"d",s:"d",shift:"sprint"};
  function kd(e){
    const k=e.key.toLowerCase(), menu=st.mode==="ready"||st.mode==="final";
    if(menu&&/^[0-6]$/.test(k)){ setMates(+k); return; }
    if(menu&&(k==="arrowleft"||k==="-")){ setMates(nMates-1); e.preventDefault(); return; }
    if(menu&&(k==="arrowright"||k==="+"||k==="=")){ setMates(nMates+1); e.preventDefault(); return; }
    if(KM[k]){ keys[KM[k]]=true; e.preventDefault(); }
    else if(k===" "||k==="enter"){ e.preventDefault(); if(st.mode==="play") kickReq=true; else action(); }
    else if(k==="e"||k==="x"){ if(st.mode==="play") passReq=true; }
  }
  function ku(e){ const k=e.key.toLowerCase(); if(KM[k]) keys[KM[k]]=false; }
  function stickShow(on,x,y){
    elRing.style.display=elNub.style.display=on?"block":"none";
    if(on){ elRing.style.left=stick.ox+"px"; elRing.style.top=stick.oy+"px"; elNub.style.left=x+"px"; elNub.style.top=y+"px"; }
  }
  function pd(e){
    e.preventDefault();
    if(st.mode!=="play"){ action(); return; }
    if(stick.id!==null) return;
    const r=cv.getBoundingClientRect();
    stick.id=e.pointerId; stick.ox=e.clientX-r.left; stick.oy=e.clientY-r.top; stick.dx=stick.dy=0;
    stickShow(true,stick.ox,stick.oy);
  }
  function pm(e){
    if(e.pointerId!==stick.id) return;
    const r=cv.getBoundingClientRect();
    let dx=e.clientX-r.left-stick.ox, dy=e.clientY-r.top-stick.oy; const d=Math.hypot(dx,dy), R=50;
    if(d>R){ dx*=R/d; dy*=R/d; }
    stick.dx=dx/R; stick.dy=dy/R;
    stickShow(true,stick.ox+dx,stick.oy+dy);
  }
  function pu(e){
    if(e.pointerId===sprintId) sprintId=null;
    if(e.pointerId!==stick.id) return;
    stick.id=null; stick.dx=stick.dy=0; stickShow(false);
  }
  const btn=fn=>e=>{ e.preventDefault(); e.stopPropagation(); fn(e); };
  elKick.addEventListener("pointerdown",btn(()=>{ if(st.mode==="play") kickReq=true; }));
  elPass.addEventListener("pointerdown",btn(()=>{ if(st.mode==="play") passReq=true; }));
  elSprint.addEventListener("pointerdown",btn(e=>{ sprintId=e.pointerId; }));
  elMn.addEventListener("pointerdown",btn(()=>setMates(nMates-1)));
  elPl.addEventListener("pointerdown",btn(()=>setMates(nMates+1)));

  newMatch(); resize();
  window.addEventListener("resize",resize);
  window.addEventListener("keydown",kd);
  window.addEventListener("keyup",ku);
  cv.addEventListener("pointerdown",pd);
  window.addEventListener("pointermove",pm);
  window.addEventListener("pointerup",pu);
  window.addEventListener("pointercancel",pu);
  raf=requestAnimationFrame(frame);
  return ()=>{
    alive=false; cancelAnimationFrame(raf);
    window.removeEventListener("resize",resize);
    window.removeEventListener("keydown",kd);
    window.removeEventListener("keyup",ku);
    window.removeEventListener("pointermove",pm);
    window.removeEventListener("pointerup",pu);
    window.removeEventListener("pointercancel",pu);
    renderer.dispose(); cv.remove(); hud.remove();
  };
}

/* =====================================================
   GAME: Line Driver — draw the route, then the car drives it
   103 levels: forest, bridge, highway, then 100 more that keep getting harder
   ===================================================== */
function lineDriver(stage){
  const cv=document.createElement("canvas"); stage.appendChild(cv);
  const ctx=cv.getContext("2d");
  const LW=800, LH=400, CAR_R=11, SPEED=135, START={x:55,y:200}, FLAG={x:745,y:200}, TOTAL=103;
  let W=0,H=0,sc=1,ox=0,oy=0,raf=0,last=0,alive=true;
  let lvl=0,maxLvl=0,tries=0,mode="draw",msg="",wait=0,clock=0;
  let path=[],drawing=false,dist=0,car={x:START.x,y:START.y,a:0};
  let trees=[],rivers=[],bands=[],lanes=[];
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
  try{ maxLvl=cl(parseInt(localStorage.getItem("linedriver_max"),10)||0,0,TOTAL-1); lvl=cl(parseInt(localStorage.getItem("linedriver_cur"),10)||0,0,maxLvl); }catch(e){}
  const save=()=>{ try{ localStorage.setItem("linedriver_max",maxLvl); localStorage.setItem("linedriver_cur",lvl); }catch(e){} };
  const name=()=>lvl===0?"Forest":lvl===1?"Bridge":lvl===2?"Highway":"";

  // Every level is built from its number, so level 57 is the same level every time.
  function generate(regen){
    let seed=((lvl+1)*7919+regen*104729)>>>0;
    const rng=()=>{ seed=(seed+0x6D2B79F5)>>>0; let t=seed; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };
    const rnd=(a,b)=>a+rng()*(b-a);
    trees=[]; rivers=[]; bands=[]; lanes=[];
    const n=lvl-3, d=n<0?0:Math.min(1,n/96);     // difficulty 0..1; it tops out at level 100
    let segs, scatter=0, corridor=36;
    if(lvl===0) segs=[{t:"col"},{t:"col"},{t:"col"},{t:"col"},{t:"col"}];
    else if(lvl===1){ segs=[{t:"col"},{t:"riv",w:160,hw:24},{t:"col"}]; scatter=6; }
    else if(lvl===2){ segs=[{t:"hwy",n:4,lw:70,cars:1,sp:1}]; scatter=10; }
    else {
      corridor=lerp(34,18,d);
      let Hn=n%3===2?1:0, Rn=n%3===1?1:0;
      if(d>.5) Hn=Math.max(Hn,1); if(d>.85) Hn=2; if(d>.4) Rn=Math.max(Rn,1);
      segs=[];
      for(let i=0;i<Hn;i++) segs.push({t:"hwy",n:Hn===2?3:(d<.3?2:d<.65?3:4),lw:56,cars:d,sp:lerp(1,1.25,d)});
      for(let i=0;i<Rn;i++) segs.push({t:"riv",w:110,hw:lerp(24,16,d)});
      const used=segs.reduce((a,s)=>a+(s.t==="hwy"?s.n*s.lw+24:s.w+36),0);
      const cols=Math.max(segs.length?0:1,Math.min(7,Math.floor((600-used)/lerp(95,66,d))));
      for(let i=0;i<cols;i++) segs.push({t:"col"});
      for(let i=segs.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [segs[i],segs[j]]=[segs[j],segs[i]]; }
      scatter=Math.round(lerp(3,9,d));
    }
    const width=s=>s.t==="col"?64:s.t==="riv"?s.w+36:s.n*s.lw+24;
    const spare=(600-segs.reduce((a,s)=>a+width(s),0))/(segs.length+1);
    let x=100+spare, prevGap=200;
    const cols=["#f59f00","#4dabf7","#e599f7","#69db7c","#ffa8a8","#fff3bf"];
    for(const s of segs){
      const w=width(s), xc=x+w/2;
      if(s.t==="col"){
        let gy; do{ gy=rnd(50,350); }while(Math.abs(gy-prevGap)<80); prevGap=gy;
        const r=18, edge=corridor+r*.8;       // the gap is exactly 2 x corridor wide
        for(let y=gy-edge;y>-15;y-=33) trees.push({x:xc+rnd(-5,5),y,r});
        for(let y=gy+edge;y<LH+15;y+=33) trees.push({x:xc+rnd(-5,5),y,r});
      } else if(s.t==="riv"){
        const y=rnd(70,330); rivers.push({x0:xc-s.w/2,x1:xc+s.w/2,y,hw:s.hw}); prevGap=y;
      } else {
        const x0=xc-s.n*s.lw/2; bands.push({x0:x0-8,x1:x0+s.n*s.lw+8,n:s.n,lw:s.lw,l0:x0});
        for(let i=0;i<s.n;i++){
          // early levels have one car per lane; later ones more and more often have two
          const cars=[], o=rnd(0,440);
          cars.push({o,c:cols[i%6]});
          if(lvl>2&&s.cars>=.3&&rng()<s.cars*.85) cars.push({o:o+220+rnd(-25,25),c:cols[(i+3)%6]});
          lanes.push({x:x0+s.lw*(i+.5),dir:rng()<.5?1:-1,sp:rnd(60,95)*s.sp,cars});
        }
      }
      x+=w+spare;
    }
    for(let i=0;i<scatter;i++){
      const t={x:rnd(110,690),y:rnd(20,380),r:rnd(15,18)};
      if(bands.some(b=>t.x>b.x0-22&&t.x<b.x1+22)||rivers.some(r=>t.x>r.x0-22&&t.x<r.x1+22)) continue;
      trees.push(t);
    }
    trees=trees.filter(t=>Math.hypot(t.x-START.x,t.y-START.y)>70&&Math.hypot(t.x-FLAG.x,t.y-FLAG.y)>70);
    for(const r of rivers) trees=trees.filter(t=>Math.abs(t.y-r.y)>55||(t.x<r.x0-90||t.x>r.x1+90));   // keep both ends of each bridge open
  }
  // check a level can really be driven: search a fine grid for a route clear of trees and water
  function solvable(){
    const C=5, nx=160, ny=80, seen=new Uint8Array(nx*ny), qu=[10+40*nx]; seen[qu[0]]=1;
    const free=(i,j)=>{
      const x=i*C+2.5, y=j*C+2.5;
      if(x<10||y<10||x>LW-10||y>LH-10) return false;
      for(const t of trees){ const dx=t.x-x, dy=t.y-y, m=t.r*.8+CAR_R+3.5; if(dx*dx+dy*dy<m*m) return false; }
      for(const r of rivers) if(x>r.x0-4&&x<r.x1+4&&Math.abs(y-r.y)>r.hw-10.5) return false;
      return true;
    };
    for(let h=0;h<qu.length;h++){
      const k=qu[h], i=k%nx, j=(k-i)/nx; if(i>=148&&Math.abs(j-40)<2) return true;
      for(const [di,dj] of [[1,0],[0,1],[0,-1],[-1,0]]){
        const a=i+di, b=j+dj, kk=a+b*nx;
        if(a<0||b<0||a>=nx||b>=ny||seen[kk]||!free(a,b)) continue;
        seen[kk]=1; qu.push(kk);
      }
    }
    return false;
  }
  function build(){ let n=0; do{ generate(n); }while(!solvable()&&++n<40); tries=0; reset("",false); save(); }
  function reset(m,keep){ if(!keep) path=[]; drawing=false; dist=0; car={x:START.x,y:START.y,a:0}; mode="draw"; msg=m; }
  function resize(){
    const r=stage.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    sc=Math.min(W/LW,H/LH); ox=(W-LW*sc)/2; oy=(H-LH*sc)/2;
  }
  const end=()=>path[path.length-1];
  const atFlag=()=>path.length>1&&Math.hypot(end().x-FLAG.x,end().y-FLAG.y)<30;
  function addPoint(x,y){
    x=cl(x,8,LW-8); y=cl(y,8,LH-8);
    const e=end(); if(e&&Math.hypot(x-e.x,y-e.y)<5) return;
    if(path.length<2500) path.push({x,y});
  }
  function go(){
    if(mode!=="draw") return;
    if(!atFlag()){ msg="The line has to reach the flag"; return; }
    const e=end(); if(e.x!==FLAG.x||e.y!==FLAG.y) path.push({x:FLAG.x,y:FLAG.y});
    drawing=false; mode="drive"; dist=0; msg=""; tries++;
  }
  function trafficY(l,c){ const L=440, p=((c.o+clock*l.sp)%L+L)%L; return l.dir>0 ? p-20 : LH+20-p; }
  function hit(){
    for(const t of trees) if(Math.hypot(t.x-car.x,t.y-car.y)<t.r*.8+CAR_R) return "tree";
    for(const r of rivers) if(car.x>r.x0+4&&car.x<r.x1-4&&Math.abs(car.y-r.y)>r.hw-7) return "water";
    for(const l of lanes) for(const c of l.cars){
      if(Math.abs(car.x-l.x)<15+CAR_R-3&&Math.abs(car.y-trafficY(l,c))<25+CAR_R-3) return "traffic";
    }
    return "";
  }
  function setLevel(n){ n=cl(n,0,maxLvl); if(n===lvl||mode!=="draw") return; lvl=n; build(); }
  function update(dt){
    clock+=dt;
    if(mode==="drive"){
      dist+=SPEED*dt;
      let d=dist, done=true;
      for(let i=1;i<path.length;i++){
        const a=path[i-1], b=path[i], s=Math.hypot(b.x-a.x,b.y-a.y);
        if(d<=s){ const k=s?d/s:0; car.x=a.x+(b.x-a.x)*k; car.y=a.y+(b.y-a.y)*k; if(s>.5) car.a=Math.atan2(b.y-a.y,b.x-a.x); done=false; break; }
        d-=s;
      }
      const h=hit();
      if(h){ mode="crash"; wait=1; msg=h==="tree"?"Crashed into a tree":h==="water"?"Splash! Stay on the bridge":"Hit by traffic"; car.why=h; }
      else if(done){ car.x=FLAG.x; car.y=FLAG.y; mode="clear"; wait=1.1; msg=lvl<TOTAL-1?"Level "+(lvl+1)+" cleared!":"You made it!"; }
    } else if(mode==="crash"){
      // the line stays, so bad timing can be retried with GO; a line through a tree or water has to be redrawn
      wait-=dt; if(wait<=0) reset(car.why==="traffic"?"Press GO to try the timing again":"Redraw the line from the red car",true);
    }
    else if(mode==="clear"){ wait-=dt; if(wait<=0){ if(lvl<TOTAL-1){ lvl++; maxLvl=Math.max(maxLvl,lvl); build(); } else mode="won"; } }
  }
  function drawCar(x,y,a,body){
    ctx.save(); ctx.translate(x,y); ctx.rotate(a);
    ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(-13,-7,28,18);
    ctx.fillStyle=body; ctx.fillRect(-15,-9,30,18);
    ctx.fillStyle="#1b2a3a"; ctx.fillRect(2,-7,7,14); ctx.fillRect(-11,-7,5,14);
    ctx.fillStyle="#fff3bf"; ctx.fillRect(13,-8,2,4); ctx.fillRect(13,4,2,4);
    ctx.restore();
  }
  const B={prev:{x:8,y:8,w:28,h:26},next:{x:184,y:8,w:28,h:26},clear:{x:LW-98,y:8,w:90,h:26},go:{x:LW-112,y:LH-46,w:104,h:36}};
  const inB=(b,p)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
  function draw(){
    ctx.fillStyle="#0b1220"; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(ox,oy); ctx.scale(sc,sc);
    ctx.beginPath(); ctx.rect(0,0,LW,LH); ctx.clip();
    const hard=Math.min(1,Math.max(0,(lvl-3)/96));
    ctx.fillStyle="rgb("+Math.round(lerp(90,70,hard))+","+Math.round(lerp(168,120,hard))+","+Math.round(lerp(86,70,hard))+")"; ctx.fillRect(0,0,LW,LH);
    ctx.fillStyle="rgba(255,255,255,.07)"; for(let i=0;i<40;i++) ctx.fillRect((i*197)%LW,(i*131)%LH,14,5);
    for(const b of rivers){
      ctx.fillStyle="#2f7fd1"; ctx.fillRect(b.x0,0,b.x1-b.x0,LH);
      ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=2;
      for(let i=0;i<8;i++){ const y=((i*52+clock*26)%(LH+40))-20, x=b.x0+10+(i*37)%Math.max(20,b.x1-b.x0-40); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+20,y); ctx.stroke(); }
      ctx.fillStyle="#8a5a2b"; ctx.fillRect(b.x0-14,b.y-b.hw,b.x1-b.x0+28,b.hw*2);
      ctx.strokeStyle="#6b4420"; ctx.lineWidth=1.5; for(let x=b.x0-10;x<b.x1+14;x+=12){ ctx.beginPath(); ctx.moveTo(x,b.y-b.hw); ctx.lineTo(x,b.y+b.hw); ctx.stroke(); }
      ctx.fillStyle="#4b2f14"; ctx.fillRect(b.x0-14,b.y-b.hw-4,b.x1-b.x0+28,4); ctx.fillRect(b.x0-14,b.y+b.hw,b.x1-b.x0+28,4);
    }
    for(const b of bands){
      ctx.fillStyle="#3b4048"; ctx.fillRect(b.x0,0,b.x1-b.x0,LH);
      ctx.fillStyle="#f1f3f5"; ctx.fillRect(b.x0-2,0,3,LH); ctx.fillRect(b.x1-1,0,3,LH);
      ctx.fillStyle="rgba(255,255,255,.7)"; for(let i=1;i<b.n;i++) for(let y=6;y<LH;y+=40) ctx.fillRect(b.l0+i*b.lw-1,y,2,20);
    }
    for(const l of lanes) for(const c of l.cars) drawCar(l.x,trafficY(l,c),l.dir>0?Math.PI/2:-Math.PI/2,c.c);
    ctx.fillStyle="rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(FLAG.x,FLAG.y,26,0,7); ctx.fill();
    ctx.fillStyle="#222"; ctx.fillRect(FLAG.x-9,FLAG.y-20,3,40);
    for(let i=0;i<3;i++) for(let j=0;j<3;j++){ ctx.fillStyle=(i+j)%2?"#fff":"#111"; ctx.fillRect(FLAG.x-6+i*7,FLAG.y-20+j*6,7,6); }
    if(path.length>1){
      ctx.lineJoin=ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); for(let i=1;i<path.length;i++) ctx.lineTo(path[i].x,path[i].y);
      ctx.strokeStyle="rgba(0,0,0,.45)"; ctx.lineWidth=7; ctx.stroke();
      ctx.strokeStyle=atFlag()||mode!=="draw"?"#fff":"#ffe066"; ctx.lineWidth=3; ctx.setLineDash([10,8]); ctx.stroke(); ctx.setLineDash([]);
      if(mode==="draw"&&!atFlag()){ const e=end(); ctx.fillStyle="#ffe066"; ctx.beginPath(); ctx.arc(e.x,e.y,7,0,7); ctx.fill(); ctx.strokeStyle="#000"; ctx.lineWidth=2; ctx.stroke(); }
    }
    drawCar(car.x,car.y,car.a,mode==="crash"?"#868e96":"#e03131");
    for(const t of trees){
      ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.arc(t.x+3,t.y+4,t.r,0,7); ctx.fill();
      ctx.fillStyle="#1f6b35"; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,7); ctx.fill();
      ctx.fillStyle="#2f9148"; ctx.beginPath(); ctx.arc(t.x-t.r*.25,t.y-t.r*.25,t.r*.6,0,7); ctx.fill();
    }
    // HUD
    ctx.textBaseline="middle"; ctx.textAlign="center"; ctx.font="700 14px system-ui,sans-serif";
    const btn=(b,label,on)=>{ ctx.fillStyle=on?"rgba(0,0,0,.6)":"rgba(0,0,0,.3)"; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.fillStyle=on?"#fff":"rgba(255,255,255,.35)"; ctx.fillText(label,b.x+b.w/2,b.y+b.h/2); };
    btn(B.prev,"◀",lvl>0); btn(B.next,"▶",lvl<maxLvl);
    ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(40,8,140,26);
    ctx.fillStyle="#fff"; ctx.fillText("Level "+(lvl+1)+"/"+TOTAL+(name()?" "+name():""),110,21);
    ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(216,8,70,26); ctx.fillStyle="#fff"; ctx.fillText("Tries "+tries,251,21);
    btn(B.clear,"Clear (R)",true);
    if(mode==="draw"&&atFlag()){ ctx.fillStyle="#37b24d"; ctx.fillRect(B.go.x,B.go.y,B.go.w,B.go.h); ctx.fillStyle="#fff"; ctx.font="800 16px system-ui,sans-serif"; ctx.fillText("GO ▶",B.go.x+B.go.w/2,B.go.y+B.go.h/2); }
    const hint = mode==="draw" ? (msg || (path.length>1 ? (atFlag()?"Press GO when the road is clear":"Keep drawing to the flag") : "Draw a line from the red car to the flag")) : msg;
    if(hint){
      ctx.font="700 15px system-ui,sans-serif";
      ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(LW/2-180,LH-38,360,28);
      ctx.fillStyle=mode==="crash"?"#ffa8a8":"#fff"; ctx.fillText(hint,LW/2,LH-24);
    }
    if(mode==="draw"&&path.length<2){ ctx.font="12px system-ui,sans-serif"; ctx.fillStyle="rgba(255,255,255,.85)"; ctx.fillText("Keys: arrows draw · Enter go · Backspace undo · [ ] change level",LW/2,LH-52); }
    if(mode==="won"){
      ctx.fillStyle="rgba(8,16,30,.72)"; ctx.fillRect(0,0,LW,LH);
      ctx.fillStyle="#fff"; ctx.font="800 34px system-ui,sans-serif"; ctx.fillText("All "+TOTAL+" levels complete!",LW/2,LH/2-30);
      ctx.font="16px system-ui,sans-serif"; ctx.fillText("You beat the hardest roads there are.",LW/2,LH/2+8);
      ctx.fillText("Tap or press Space to start again from level 1",LW/2,LH/2+36);
    }
    ctx.textBaseline="alphabetic";
    ctx.restore();
  }
  function frame(t){
    if(!alive) return;
    const dt=Math.min(.04,(t-last)/1000||0); last=t;
    update(dt); draw(); raf=requestAnimationFrame(frame);
  }
  function restart(){ lvl=0; build(); }
  const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc}; };
  function pd(e){
    e.preventDefault();
    if(mode==="won"){ restart(); return; }
    if(mode!=="draw") return;
    const p=pt(e);
    if(inB(B.clear,p)){ reset("",false); return; }
    if(inB(B.prev,p)){ setLevel(lvl-1); return; }
    if(inB(B.next,p)){ setLevel(lvl+1); return; }
    if(atFlag()&&inB(B.go,p)){ go(); return; }
    const e0=end();
    if(Math.hypot(p.x-START.x,p.y-START.y)<50){ path=[{x:START.x,y:START.y}]; drawing=true; msg=""; }          // start again from the car
    else if(e0&&path.length>1&&!atFlag()&&Math.hypot(p.x-e0.x,p.y-e0.y)<45){ drawing=true; msg=""; }             // carry on from the end of the line
    else if(!atFlag()) msg="Start your line at the red car";
  }
  function pm(e){ if(drawing&&mode==="draw"){ const p=pt(e); addPoint(p.x,p.y); } }
  function pu(){ if(!drawing) return; drawing=false; if(atFlag()) go(); else if(path.length>1) msg="Press the yellow dot to keep drawing"; }
  function kd(e){
    const k=e.key;
    if(mode==="won"){ if(k===" "||k==="Enter"){ e.preventDefault(); restart(); } return; }
    if(mode!=="draw") return;
    const D={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8],a:[-8,0],d:[8,0],w:[0,-8],s:[0,8]}[k.length===1?k.toLowerCase():k];
    if(D){ e.preventDefault(); if(atFlag()) return; if(!path.length) path=[{x:START.x,y:START.y}]; const p=end(); addPoint(p.x+D[0],p.y+D[1]); msg=""; }
    else if(k==="Enter"||k===" "){ e.preventDefault(); go(); }
    else if(k==="Backspace"){ e.preventDefault(); path.length=Math.max(0,path.length-3); if(path.length<2) path=[]; msg=""; }
    else if(k==="r"||k==="R") reset("",false);
    else if(k==="["||k===",") setLevel(lvl-1);
    else if(k==="]"||k===".") setLevel(lvl+1);
  }
  resize(); build();
  window.addEventListener("resize",resize);
  window.addEventListener("keydown",kd);
  cv.addEventListener("pointerdown",pd);
  cv.addEventListener("pointermove",pm);
  cv.addEventListener("pointerup",pu);
  cv.addEventListener("pointercancel",pu);
  raf=requestAnimationFrame(frame);
  return ()=>{
    alive=false; cancelAnimationFrame(raf);
    window.removeEventListener("resize",resize);
    window.removeEventListener("keydown",kd);
    cv.remove();
  };
}

/* =====================================================
   GAME: Bone Hound — feed the dog, walk it, dig the poop for dinosaur bones, sell them, buy more food
   ===================================================== */
function boneHound(stage){
  const cv=document.createElement("canvas"); stage.appendChild(cv);
  const ctx=cv.getContext("2d");
  const LW=800, LH=400, PX=530;
  const BONES=[
    {n:"Compy Rib",r:"Common",v:4,c:"#ced4da"},
    {n:"Raptor Claw",r:"Uncommon",v:12,c:"#69db7c"},
    {n:"Triceratops Horn",r:"Rare",v:40,c:"#4dabf7"},
    {n:"T-Rex Tooth",r:"Epic",v:250,c:"#da77f2"},
    {n:"Golden T-Rex Skull",r:"Legendary",v:3000,c:"#ffd43b"}
  ];
  // odds are the chances (in %) of each bone, common to legendary
  const FOODS=[
    {n:"Kibble",p:5,o:[70,22,7,.9,.1],c:"#c08a4a"},
    {n:"Steak",p:25,o:[40,35,20,4.5,.5],c:"#e8590c"},
    {n:"Mystery Meat",p:100,o:[10,30,40,17,3],c:"#9c36b5"},
    {n:"Dino Feast",p:500,o:[0,0,30,55,15],c:"#f59f00"}
  ];
  const SCRAPS={n:"Table Scraps",p:0,o:[85,14,1,0,0],c:"#868e96"};
  let W=0,H=0,sc=1,ox=0,oy=0,raf=0,last=0,alive=true,clock=0;
  let S={money:10,counts:[0,0,0,0,0],earned:0};
  try{ const v=JSON.parse(localStorage.getItem("bonehound")||"null"); if(v&&isFinite(v.money)&&Array.isArray(v.counts)&&v.counts.length===5) S={money:Math.max(0,+v.money),counts:v.counts.map(x=>+x||0),earned:+v.earned||0}; }catch(e){}
  const save=()=>{ try{ localStorage.setItem("bonehound",JSON.stringify(S)); }catch(e){} };
  let mode="hungry", timer=0, food=null, found=-1, note="";

  function resize(){
    const r=stage.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    sc=Math.min(W/LW,H/LH); ox=(W-LW*sc)/2; oy=(H-LH*sc)/2;
  }
  const broke=()=>S.money<FOODS[0].p;
  function menu(){ return broke() ? [SCRAPS].concat(FOODS) : FOODS; }
  function feed(f){
    if(mode!=="hungry"||!f) return;
    if(S.money<f.p){ note="You need $"+f.p+" for "+f.n; return; }
    S.money-=f.p; food=f; mode="eating"; timer=1.3; note=""; save();
  }
  function roll(o){ let r=Math.random()*100; for(let i=0;i<5;i++){ r-=o[i]; if(r<0) return i; } return o.findIndex(x=>x>0); }
  function action(){
    if(mode==="full"){ mode="pooping"; timer=1.4; }
    else if(mode==="poop"){ found=roll(food.o); mode="found"; }
    else if(mode==="found"){ const b=BONES[found]; S.money+=b.v; S.earned+=b.v; S.counts[found]++; save(); mode="hungry"; food=null; found=-1; }
  }
  function update(dt){
    clock+=dt;
    if(mode==="eating"||mode==="pooping"){ timer-=dt; if(timer<=0) mode=mode==="eating"?"full":"poop"; }
  }
  const money=n=>"$"+Math.floor(n).toLocaleString("en-US");
  const actionLabel=()=>mode==="hungry"?"Pick a food to feed the dog":mode==="eating"?"Munch munch…":mode==="full"?"Walk the dog":mode==="pooping"?"…":mode==="poop"?"Dig for bones":"Sell for "+money(BONES[found].v);
  const actionOn=()=>mode==="full"||mode==="poop"||mode==="found";
  const foodRect=i=>({x:PX+14,y:58+i*44,w:LW-PX-28,h:38});
  const actRect={x:PX+14,y:300,w:LW-PX-28,h:46};

  function ell(x,y,rx,ry,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill(); }
  function drawBone(x,y,s,c){
    ctx.save(); ctx.translate(x,y); ctx.rotate(-.5); ctx.fillStyle=c;
    ctx.fillRect(-s,-s*.18,s*2,s*.36);

    ell(x,y+s*.3,s,s*.36,"#6b4420"); ell(x,y-s*.05,s*.72,s*.3,"#7a4f26"); ell(x,y-s*.36,s*.44,s*.24,"#6b4420"); ell(x+s*.05,y-s*.6,s*.18,s*.14,"#7a4f26");

    ctx.fillStyle=g; ctx.fillRect(0,0,PX,250);

    ctx.fillStyle="#c9a26b"; for(let x=0;x<PX;x+=26){ ctx.fillRect(x,170,22,82); } ctx.fillStyle="#b08955"; ctx.fillRect(0,190,PX,6); ctx.fillRect(0,228,PX,6);
    ctx.fillStyle="#51a84f"; ctx.fillRect(0,248,PX,LH-248);
    ctx.fillStyle="#449a45"; for(let i=0;i<30;i++) ctx.fillRect((i*83)%PX,258+(i*47)%130,10,4);
    const dx=mode==="pooping"||mode==="poop"||mode==="found"?330:250, dy=262;

      ctx.textAlign="right"; ctx.fillStyle=can?"#69db7c":"#6b759e"; ctx.fillText(f.p?money(f.p):"FREE",r.x+r.w-10,r.y+r.h/2);

    });
    ctx.textBaseline="alphabetic";
    ctx.restore();
  }
  function frame(t){
    if(!alive) return;
    const dt=Math.min(.05,(t-last)/1000||0); last=t;
    update(dt); draw(); raf=requestAnimationFrame(frame);
  }
  function pd(e){
    e.preventDefault();
    const r=cv.getBoundingClientRect(), p={x:(e.clientX-r.left-ox)/sc,y:(e.clientY-r.top-oy)/sc};
    const inR=b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
    if(inR(actRect)||(p.x<PX&&actionOn())){ action(); return; }     // the big button, or tapping the yard
    const m=menu(); for(let i=0;i<m.length;i++) if(inR(foodRect(i))){ feed(m[i]); return; }
  }
  function kd(e){
    const k=e.key;
    if(/^[1-5]$/.test(k)){ feed(menu()[+k-1]); }
    else if(k===" "||k==="Enter"){ e.preventDefault(); action(); }
  }
  resize();
  window.addEventListener("resize",resize);
  window.addEventListener("keydown",kd);
  cv.addEventListener("pointerdown",pd);
  raf=requestAnimationFrame(frame);
  return ()=>{
    alive=false; cancelAnimationFrame(raf);
    window.removeEventListener("resize",resize);
    window.removeEventListener("keydown",kd);
    cv.remove();
  };
}

/* =====================================================
   GAME: Retro Gridiron — pixel football, you run the offense
   ===================================================== */
function retroGridiron(stage){
  const cv = document.createElement("canvas"); stage.appendChild(cv);
  const ctx = cv.getContext("2d");
  const FW=53.3, DRIVES=4, HUD=58;
  let W=0,H=0,ppy=10,top=HUD,cam=10,raf=0,last=0,alive=true,g,p;
  const steer={on:false,y:0,k:0};
  const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

  function resize(){
    const r=stage.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ppy=Math.min((H-HUD-8)/FW, W/32); top=HUD+((H-HUD)-FW*ppy)/2;
  }
  function newGame(){
    g={you:0,cpu:0,drive:1,L:25,down:1,line:35,mode:"dead",msg:"RETRO GRIDIRON",sub:"You run the offense. "+DRIVES+" drives each.",next:()=>{g.mode="pre";}};
    setupPlay(); cam=g.L-9;
  }
  function setupPlay(){
    const L=g.L; steer.on=false; steer.k=0;
    p={qb:{x:L-5,y:26.6},recs:[],defs:[],rush:[],ball:null,runner:null};
    const kinds=["go","slant","out","post","curl"];
    [8,34,45.5].forEach((y,n)=>{
      const c=y<26.6?1:-1, k=kinds[Math.floor(Math.random()*kinds.length)];
      let wp;
      if(k==="go")wp=[[L+45,y]];
      else if(k==="slant")wp=[[L+4,y],[L+22,y+c*14]];
      else if(k==="out")wp=[[L+9,y],[L+11,clamp(y-c*7,2,FW-2)]];
      else if(k==="post")wp=[[L+12,y],[L+35,y+c*12]];
      else wp=[[L+11,y],[L+8.5,y+c*2]];
      const r={x:L,y,wp,i:0,sp:rnd(7.3,7.8),vx:0,vy:0,n:n+1};
      p.recs.push(r);
      p.defs.push({x:L+5,y,sp:rnd(6.4,7.4),cover:r});
    });
    p.defs.push({x:L+17,y:26.6,sp:6.9,cover:null});
    p.rush=[{x:L+1,y:22,sp:rnd(2.0,2.6)},{x:L+1,y:31,sp:rnd(2.0,2.6)}];
  }
  function moveTo(o,tx,ty,sp,dt){
    const dx=tx-o.x, dy=ty-o.y, d=Math.hypot(dx,dy);
    if(d<.05){o.vx=o.vy=0;return true;}
    const s=Math.min(d,sp*dt); o.vx=dx/d*sp; o.vy=dy/d*sp; o.x+=dx/d*s; o.y+=dy/d*s;
    return d<=s;
  }
  const spot=()=> g.L<50 ? "OWN "+Math.round(g.L) : g.L>50 ? "OPP "+Math.round(100-g.L) : "the 50";
  function dead(msg,sub,next){ g.mode="dead"; g.msg=msg; g.sub=sub||""; g.next=next; steer.on=false; }
  function nextSnap(){ setupPlay(); g.mode="pre"; }
  function endPlay(x,msg){
    x=clamp(x,1,99.5);
    const gain=Math.round(x-g.L); g.L=x;
    const yds = gain===0 ? "No gain" : (gain>0?"+":"")+gain+" yd"+(Math.abs(gain)===1?"":"s");
    if(x>=g.line){ g.down=1; g.line=Math.min(100,x+10); dead(msg,yds+" · First down!",nextSnap); }
    else { g.down++; if(g.down>4) driveEnd(msg,yds+" · Turnover on downs"); else dead(msg,yds,nextSnap); }
  }
  function driveEnd(msg,sub){
    dead(msg,sub,()=>{
      const r=Math.random(), pts=r<.3?7:r<.48?3:0; g.cpu+=pts;
      dead(pts===7?"CPU touchdown":pts===3?"CPU field goal":"Your defense holds!", pts?"CPU +"+pts:"No points for the CPU",()=>{
        if(g.drive>=DRIVES){ g.mode="final"; return; }
        g.drive++; g.L=25; g.down=1; g.line=35; nextSnap();
      });
    });
  }
  const fgDist=()=>Math.round(100-g.L+17);
  const fgOK=()=>g.mode==="pre"&&g.down===4&&g.L>=55;
  function kick(){
    const ch=clamp(1.25-fgDist()/60,.2,.97);
    if(Math.random()<ch){ g.you+=3; driveEnd("Field goal is GOOD!","+3"); } else driveEnd("No good!","The kick misses");
  }
  function throwTo(wx,wy){
    const q=p.qb; let tx=wx, ty=wy, best=null, bd=3.5;
    for(const r of p.recs){ const d=Math.hypot(r.x-wx,r.y-wy); if(d<bd){bd=d;best=r;} }
    let T=Math.hypot(tx-q.x,ty-q.y)/26;
    if(best){ for(let i=0;i<3;i++){ tx=best.x+best.vx*T; ty=best.y+best.vy*T; T=Math.hypot(tx-q.x,ty-q.y)/26; } }
    ty=clamp(ty,-2,FW+2);
    p.ball={sx:q.x,sy:q.y,tx,ty,x:q.x,y:q.y,t:0,T:Math.max(.15,T)};
    g.mode="air";
  }
  function resolve(){
    const b={x:p.ball.tx,y:p.ball.ty};
    let r=null, rd=2.2; for(const o of p.recs){ const d=dist(o,b); if(d<rd){rd=d;r=o;} }
    let dd=9; for(const o of p.defs){ dd=Math.min(dd,dist(o,b)); }
    if(dd<1.3&&dd<rd){
      p.ball=null;
      if(Math.random()<.3) driveEnd("Intercepted!","The defense picks it off"); else endPlay(g.L,"Broken up");
      return;
    }
    if(!r||b.y<0||b.y>FW||(dd<1&&Math.random()<.35)){ p.ball=null; endPlay(g.L,"Incomplete"); return; }
    p.ball=null; p.runner=r; r.x=b.x; r.y=clamp(b.y,.5,FW-.5); g.mode="run";
  }
  function update(dt){
    const m=g.mode;
    const tc = m==="run" ? p.runner.x-10 : m==="air" ? Math.max(g.L-9,p.ball.x-14) : g.L-9;
    cam += (clamp(tc,-10,110-W/ppy)-cam)*Math.min(1,dt*5);
    if(m==="live"||m==="air"){
      for(const r of p.recs){
        if(r.i<r.wp.length){ if(moveTo(r,r.wp[r.i][0],r.wp[r.i][1],r.sp,dt)) r.i++; } else r.vx=r.vy=0;
      }
      for(const d of p.defs){
        if(d.cover) moveTo(d,d.cover.x+.9,d.cover.y,d.sp,dt);
        else if(m==="air") moveTo(d,p.ball.tx,p.ball.ty,d.sp,dt);
        else moveTo(d,d.x+1,26.6,1.6,dt);
      }
      for(const r of p.rush){
        if(m==="live"){ moveTo(r,p.qb.x,p.qb.y,r.sp,dt); if(dist(r,p.qb)<1.2){ endPlay(p.qb.x,"Sacked!"); return; } }
      }
    }
    if(m==="air"){
      const b=p.ball; b.t+=dt; const k=Math.min(1,b.t/b.T);

      if(k>=1) resolve();
    } else if(m==="run"){
      const r=p.runner;
      let vy = steer.on ? clamp((steer.y-r.y)*4,-6.5,6.5) : steer.k*6.5;
      r.x+=7.7*dt; r.y+=vy*dt;
      for(const d of p.defs.concat(p.rush)){
        moveTo(d,r.x+(d.x>r.x?.6:1.5),r.y,d.cover===undefined?5:d.sp,dt);
        if(dist(d,r)<1.25){ endPlay(r.x,"Tackled"); return; }
      }
      if(r.x>=100){ g.you+=7; g.L=100; driveEnd("TOUCHDOWN!","+7"); return; }
      if(r.y<0||r.y>FW){ endPlay(r.x,"Out of bounds"); return; }
    }
  }
  // ---- retro renderer: field + sprites drawn tiny, then blown up with hard pixels ----
  const PF='"Press Start 2P",ui-monospace,Menlo,monospace';
  try{ document.fonts.load('10px "Press Start 2P"'); }catch(e){}
  const buf=document.createElement("canvas"), bx=buf.getContext("2d");
  let S=4,q=3,scan=null;
  const X=x=>Math.round((x-cam)*q), Y=y=>Math.round(top/S+y*q);
  const CROWD=["#f8f8f8","#f83800","#0058f8","#f8b800","#6844fc","#00a844","#503000","#bcbcbc"];
  function sprite(o,body,helm,dir,moving){
    const u=Math.max(1,Math.round(q/3)), x0=X(o.x)-Math.floor(2.5*u), y0=Y(o.y)-4*u;
    bx.fillStyle="#005800"; bx.fillRect(x0,y0+7*u,5*u,u);
    bx.fillStyle=helm; bx.fillRect(x0+u,y0,3*u,3*u);
    bx.fillStyle="#202020"; bx.fillRect(dir>0?x0+3*u:x0+u,y0+u,u,u);
    bx.fillStyle=body; bx.fillRect(x0,y0+3*u,5*u,2*u);
    const f=moving ? Math.floor(performance.now()/110+o.y)%2 : 0;
    bx.fillStyle="#f8f8f8";
    if(f){ bx.fillRect(x0,y0+5*u,u,2*u); bx.fillRect(x0+4*u,y0+5*u,u,2*u); }
    else { bx.fillRect(x0+u,y0+5*u,u,2*u); bx.fillRect(x0+3*u,y0+5*u,u,2*u); }
  }
  function txt(t,x,y,size,color,align){
    ctx.font=size+"px "+PF; ctx.textAlign=align||"center"; t=String(t).toUpperCase();
    ctx.fillStyle="#000"; ctx.fillText(t,x+2,y+2);
    ctx.fillStyle=color; ctx.fillText(t,x,y);
  }
  function box(l1,l2,l3){
    const bw=Math.min(W-20,350), bh=l3?112:90, x=Math.round((W-bw)/2), y=Math.round(top+FW*ppy/2-bh/2);
    ctx.fillStyle="#000"; ctx.fillRect(x,y,bw,bh);
    ctx.fillStyle="#f8f8f8"; ctx.fillRect(x,y,bw,4); ctx.fillRect(x,y+bh-4,bw,4); ctx.fillRect(x,y,4,bh); ctx.fillRect(x+bw-4,y,4,bh);
    ctx.fillStyle="#f83800"; ctx.fillRect(x+8,y+8,bw-16,2); ctx.fillRect(x+8,y+bh-10,bw-16,2);
    const fit=(t,max)=>Math.max(7,Math.min(max,Math.floor((bw-28)/String(t).length)));
    txt(l1,W/2,y+40,fit(l1,16),"#f8d800");
    txt(l2,W/2,y+64,fit(l2,9),"#f8f8f8");
    if(l3 && Math.floor(performance.now()/450)%2) txt(l3,W/2,y+88,fit(l3,9),"#58d854");
  }
  function fgRect(){ const w=Math.min(W-40,270); return {x:(W-w)/2,y:top+FW*ppy-52,w,h:38}; }
  function draw(){
    S=Math.max(2,Math.round(ppy/3)); q=ppy/S;
    const bw=Math.ceil(W/S), bh=Math.ceil(H/S);
    if(buf.width!==bw||buf.height!==bh){ buf.width=bw; buf.height=bh; }
    const m=g.mode, live=(m==="live"||m==="air"||m==="run");
    bx.fillStyle="#000"; bx.fillRect(0,0,bw,bh);
    const fy=Y(0), fh=Math.round(FW*q), co=Math.round(cam*q);
    // crowd in the stands (any space above / below the field)
    for(const [y0,y1] of [[Math.ceil(HUD/S),fy-2],[fy+fh+2,bh]]){
      for(let y=y0;y+2<=y1;y+=2) for(let x=-(co&1);x<bw;x+=2){
        const hsh=((((x+co)>>1)*73856093)^(y*19349663))>>>0;
        bx.fillStyle=CROWD[hsh%CROWD.length]; bx.fillRect(x,y,2,2);
