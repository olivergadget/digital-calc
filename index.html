      bx.fillStyle = x<0 ? "#0038a8" : x>=100 ? "#a80020" : ((x/5)%2 ? "#008800" : "#00a800");
      bx.fillRect(x0,fy,w,fh);
      if(ez){ bx.fillStyle = x<0 ? "#0058f8" : "#f83800"; for(let y=fy;y<fy+fh;y+=4) bx.fillRect(x0,y,w,1); }
    }
    bx.fillStyle="#f8f8f8";
    for(let x=0;x<=100;x+=5) bx.fillRect(X(x),fy,1,fh);
    for(let x=1;x<100;x++){ if(x%5){ const xx=X(x); if(xx>=0&&xx<bw){ bx.fillRect(xx,Y(18),1,1); bx.fillRect(xx,Y(35.3),1,1); bx.fillRect(xx,fy+1,1,1); bx.fillRect(xx,fy+fh-2,1,1); } } }
    bx.fillRect(X(-10),fy-1,X(110)-X(-10),1); bx.fillRect(X(-10),fy+fh,X(110)-X(-10),1);
    if(m!=="final"){
      bx.fillStyle="#58a8ff"; bx.fillRect(X(g.L),fy,1,fh);
      if(g.line<100){ bx.fillStyle="#f8d800"; bx.fillRect(X(g.line),fy,1,fh); }
      const all=[];
      for(const d of p.rush) all.push([d,"#a80020","#f8f8f8",-1]);
      for(const d of p.defs) all.push([d,"#a80020","#f8f8f8",-1]);
      if(m!=="run") all.push([p.qb,"#0058f8","#f8d800",1]);
      for(const r of p.recs) all.push([r,"#0058f8","#f8d800",1]);
      all.sort((a,b)=>a[0].y-b[0].y);
      for(const a of all) sprite(a[0],a[1],a[2],a[3],live);
      if(p.ball){
        const b=p.ball, k=Math.max(0,Math.min(1,b.t/b.T)), lift=Math.round(Math.sin(Math.PI*k)*q*2.2);
        bx.fillStyle="#005800"; bx.fillRect(X(b.x)-1,Y(b.y),2,1);
        bx.fillStyle="#ac7c00"; bx.fillRect(X(b.x)-1,Y(b.y)-1-lift,2,2);
        if(Math.floor(performance.now()/90)%2){ bx.fillStyle="#f8f8f8"; const tx=X(b.tx), ty=Y(b.ty); bx.fillRect(tx-2,ty,5,1); bx.fillRect(tx,ty-2,1,5); }
      } else if(m==="run"){
        const r=p.runner; bx.fillStyle="#ac7c00"; bx.fillRect(X(r.x)+2,Y(r.y),2,2);
      }
    }
    // blow it up with hard pixel edges
    ctx.imageSmoothingEnabled=false;
    ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
    ctx.drawImage(buf,0,0,bw*S,bh*S);
    // yard numbers + receiver numbers
    ctx.globalAlpha=.5;
    for(let x=10;x<=90;x+=10){ const n=Math.min(x,100-x), sx=X(x)*S; if(sx>-40&&sx<W+40){ txt(n,sx,(fy+Math.round(7*q))*S,Math.round(ppy*1.6),"#f8f8f8"); txt(n,sx,(fy+fh-Math.round(3*q))*S,Math.round(ppy*1.6),"#f8f8f8"); } }
    ctx.globalAlpha=1;
    if(m==="live"||m==="pre") for(const r of p.recs) txt(r.n,X(r.x)*S,(Y(r.y)-Math.round(2*q))*S,10,"#f8d800");
    // HUD
    ctx.fillStyle="#000"; ctx.fillRect(0,0,W,HUD);
    ctx.fillStyle="#f8f8f8"; ctx.fillRect(0,HUD-3,W,3);
    txt("YOU "+g.you+" CPU "+g.cpu,12,26,13,"#f8f8f8","left");
    txt("DRV "+g.drive+"/"+DRIVES,W-12,24,9,"#58d854","right");
    const ord=["1st","2nd","3rd","4th"][Math.min(3,g.down-1)];
    txt(ord+" & "+(g.line>=100?"Goal":Math.max(1,Math.ceil(g.line-g.L)))+" at "+spot(),12,46,9,"#f8d800","left");
    const by=top+FW*ppy-10;
    if(m==="pre"){
      box(ord+" DOWN","Get ready","Tap or Space to snap");
      if(fgOK()){
        const r=fgRect(); ctx.fillStyle="#000"; ctx.fillRect(r.x+4,r.y+4,r.w,r.h);
        ctx.fillStyle="#f8d800"; ctx.fillRect(r.x,r.y,r.w,r.h);
        ctx.font="9px "+PF; ctx.textAlign="center"; ctx.fillStyle="#000"; ctx.fillText("KICK FG "+fgDist()+" YD (K)",W/2,r.y+24);
      }
    }
    else if(m==="live") txt("Tap a receiver or 1 2 3",W/2,by,8,"#f8f8f8");
    else if(m==="run") txt("Hold above/below or ↑ ↓",W/2,by,8,"#f8f8f8");
    else if(m==="dead") box(g.msg,g.sub,"Tap or Space");
    else if(m==="final") box(g.you>g.cpu?"YOU WIN!":g.you<g.cpu?"GAME OVER":"TIE GAME","Final  You "+g.you+"  CPU "+g.cpu,"Tap or Space to replay");
    // CRT scanlines + dark corners
    if(!scan){
      const c=document.createElement("canvas"); c.width=1; c.height=3;
      const k=c.getContext("2d"); k.fillStyle="rgba(0,0,0,.3)"; k.fillRect(0,2,1,1);
      scan=ctx.createPattern(c,"repeat");
    }
    if(scan){ ctx.fillStyle=scan; ctx.fillRect(0,0,W,H); }
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
    if(v){ v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.5)"); ctx.fillStyle=v; ctx.fillRect(0,0,W,H); }
  }
  function frame(t){
    if(!alive)return;
    const dt=Math.min(.04,(t-last)/1000||0); last=t;
    update(dt); draw(); raf=requestAnimationFrame(frame);
  }
  function tap(px,py){
    const m=g.mode, wx=cam+px/ppy, wy=(py-top)/ppy;
    if(m==="pre"){
      if(fgOK()){ const r=fgRect(); if(px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h){ kick(); return; } }
      g.mode="live";
    }
    else if(m==="live") throwTo(wx,wy);
    else if(m==="run"){ steer.on=true; steer.y=wy; }
    else if(m==="dead") g.next();
    else if(m==="final") newGame();
  }
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top]; };
  function pd(e){ e.preventDefault(); const [x,y]=pos(e); tap(x,y); }
  function pm(e){ if(steer.on){ steer.y=(pos(e)[1]-top)/ppy; } }
  function pu(){ steer.on=false; }
  function kd(e){
    const m=g.mode;
    if(e.key==="ArrowUp"||e.key==="w"||e.key==="W"){ steer.k=-1; e.preventDefault(); }
    else if(e.key==="ArrowDown"||e.key==="s"||e.key==="S"){ steer.k=1; e.preventDefault(); }
    else if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(m==="pre")g.mode="live"; else if(m==="dead")g.next(); else if(m==="final")newGame(); }
    else if(m==="live"&&/^[123]$/.test(e.key)){ const r=p.recs[+e.key-1]; throwTo(r.x,r.y); }
    else if(m==="pre"&&(e.key==="k"||e.key==="K")&&fgOK()) kick();
  }
  function ku(e){ if(["ArrowUp","ArrowDown","w","s","W","S"].includes(e.key)) steer.k=0; }
  resize(); newGame();
  window.addEventListener("resize",resize);
  window.addEventListener("keydown",kd);
  window.addEventListener("keyup",ku);
  cv.addEventListener("pointerdown",pd);
  cv.addEventListener("pointermove",pm);
  cv.addEventListener("pointerup",pu);
  cv.addEventListener("pointercancel",pu);
  raf=requestAnimationFrame(frame);
  return () => {
    alive=false; cancelAnimationFrame(raf);
    window.removeEventListener("resize",resize);
    window.removeEventListener("keydown",kd);
    window.removeEventListener("keyup",ku);
    cv.remove();
  };
}

/* =====================================================
   GAME: Melon Merge — drop fruit, match two to merge up
   ===================================================== */
function melonMerge(stage){
  const cv = document.createElement("canvas"); stage.appendChild(cv);
  const ctx = cv.getContext("2d");
  const LW=600, LH=340, LINE=62, DROPY=33, G=1500;
  const T = [
    {r:9,c:"#e03131",e:"🍒"},{r:13,c:"#ff6b6b",e:"🍓"},{r:17,c:"#9c36b5",e:"🍇"},{r:22,c:"#fd7e14",e:"🍊"},
    {r:27,c:"#f03e3e",e:"🍎"},{r:32,c:"#d8e86a",e:"🍐"},{r:38,c:"#ffa8a8",e:"🍑"},{r:45,c:"#fcc419",e:"🍍"},
    {r:52,c:"#b2f2bb",e:"🍈"},{r:60,c:"#2f9e44",e:"🍉"}
  ];
  let W=0,H=0,sc=1,ox=0,oy=0,raf=0,last=0,alive=true,st,best=0;
  try{ best = +localStorage.getItem("melonmerge_best") || 0; }catch(e){}
  const rnd = () => Math.floor(Math.random()*5);

  function reset(){ st = { mode:"play", fruits:[], aim:LW/2, cur:rnd(), next:rnd(), cool:0, score:0, danger:0, pops:[] }; }
  function resize(){
    const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio||1,2);
    W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    sc = Math.min(W/LW, H/LH); ox=(W-LW*sc)/2; oy=(H-LH*sc)/2;
  }
  function drop(){
    if (st.mode!=="play" || st.cool>0) return;
    const r=T[st.cur].r;
    st.fruits.push({x:Math.max(r,Math.min(LW-r,st.aim)), y:DROPY, vx:0, vy:0, t:st.cur, age:0});
    st.cur=st.next; st.next=rnd(); st.cool=.55;
  }
  function step(h){
    const F=st.fruits;
    for (const f of F){
      f.vy += G*h; f.x += f.vx*h; f.y += f.vy*h;
      const r=T[f.t].r;
      if (f.x<r){ f.x=r; f.vx=-f.vx*.3; } else if (f.x>LW-r){ f.x=LW-r; f.vx=-f.vx*.3; }
      if (f.y>LH-r){ f.y=LH-r; f.vy=-f.vy*.2; f.vx*=.96; }
    }
    const born=[];
    for (let i=0;i<F.length;i++){
      const a=F[i]; if (a.dead) continue;
      for (let j=i+1;j<F.length;j++){
        const b=F[j]; if (b.dead) continue;
        const ra=T[a.t].r, rb=T[b.t].r;
        let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy, m=ra+rb;
        if (d2>=m*m) continue;
        if (a.t===b.t){
          a.dead=b.dead=true;
          const x=(a.x+b.x)/2, y=(a.y+b.y)/2;
          st.pops.push({x,y,r:ra,life:.3});
          if (a.t<T.length-1){ born.push({x,y,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2,t:a.t+1,age:1}); st.score += (a.t+2)*2; }
          else st.score += 100;
          break;
        }
        let d=Math.sqrt(d2)||.01; const nx=dx/d, ny=dy/d, ov=m-d;
        const ia=1/(ra*ra), ib=1/(rb*rb), is=ia+ib;
        a.x-=nx*ov*ia/is; a.y-=ny*ov*ia/is; b.x+=nx*ov*ib/is; b.y+=ny*ov*ib/is;
        const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if (vn<0){
          const jm=-(1.12)*vn/is;
          a.vx-=jm*ia*nx; a.vy-=jm*ia*ny; b.vx+=jm*ib*nx; b.vy+=jm*ib*ny;
        }
      }
    }
    if (born.length || F.some(f=>f.dead)) st.fruits = F.filter(f=>!f.dead).concat(born);
  }
  function update(dt){
    for (const p of st.pops) p.life-=dt;
    st.pops = st.pops.filter(p=>p.life>0);
    if (st.mode!=="play") return;
    st.cool=Math.max(0,st.cool-dt);
    for (let i=0;i<6;i++) step(dt/6);
    let over=false;
    for (const f of st.fruits){ f.age+=dt; f.vx*=.995; if (f.age>1.5 && f.y-T[f.t].r<LINE) over=true; }
    st.danger = over ? st.danger+dt : 0;
    if (st.danger>1.5){
      st.mode="over";
      if (st.score>best){ best=st.score; try{localStorage.setItem("melonmerge_best",best);}catch(e){} }
    }
  }
  function fruit(x,y,t,alpha){
    const f=T[t];
    ctx.globalAlpha=alpha; ctx.fillStyle=f.c;
    ctx.beginPath(); ctx.arc(x,y,f.r,0,7); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.28)";
    ctx.beginPath(); ctx.arc(x-f.r*.3,y-f.r*.35,f.r*.28,0,7); ctx.fill();
    ctx.font=(f.r*1.1)+"px system-ui,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="#000"; ctx.fillText(f.e,x,y+f.r*.06);
    ctx.globalAlpha=1;
  }
  function draw(){
    ctx.fillStyle="#2a1d14"; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.translate(ox,oy); ctx.scale(sc,sc);
    ctx.fillStyle="#fff4d6"; ctx.fillRect(0,0,LW,LH);
    ctx.fillStyle="#ffe3a6"; ctx.fillRect(0,0,LW,LINE);
    ctx.strokeStyle = st.danger>0 ? "#e03131" : "#d9a441"; ctx.lineWidth=2; ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.moveTo(0,LINE); ctx.lineTo(LW,LINE); ctx.stroke(); ctx.setLineDash([]);
    if (st.mode==="play"){
      const r=T[st.cur].r, x=Math.max(r,Math.min(LW-r,st.aim));
      ctx.strokeStyle="rgba(120,80,20,.25)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,DROPY); ctx.lineTo(x,LH); ctx.stroke();
      fruit(x,DROPY,st.cur, st.cool>0 ? .35 : 1);
    }
    for (const f of st.fruits) fruit(f.x,f.y,f.t,1);
    for (const p of st.pops){
      ctx.strokeStyle="rgba(255,170,60,"+(p.life/.3)+")"; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(2-p.life/.3),0,7); ctx.stroke();
    }
    ctx.textBaseline="alphabetic";
    ctx.fillStyle="#5c3b12"; ctx.textAlign="left"; ctx.font="800 22px system-ui,sans-serif";
    ctx.fillText(st.score,10,26);
    ctx.font="600 11px system-ui,sans-serif"; ctx.fillText("BEST "+best,10,42);
    ctx.textAlign="right"; ctx.fillText("NEXT",LW-40,24);
    ctx.save(); ctx.translate(LW-20,20); ctx.scale(.5,.5); fruit(0,0,st.next,1); ctx.restore();
    if (st.mode==="over"){
      ctx.fillStyle="rgba(40,20,5,.65)"; ctx.fillRect(0,0,LW,LH);
      ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
      ctx.font="800 32px system-ui,sans-serif"; ctx.fillText("Game over",LW/2,LH*.42);
      ctx.font="500 16px system-ui,sans-serif";
      ctx.fillText("Score "+st.score+"   ·   Best "+best,LW/2,LH*.42+32);
      ctx.fillText("Tap or press Space to play again",LW/2,LH*.42+62);
    }
    ctx.restore();
  }
  function frame(t){
    if (!alive) return;
    const dt=Math.min(.033,(t-last)/1000||0); last=t;
    update(dt); draw(); raf=requestAnimationFrame(frame);
  }
  const lx = e => { const r=cv.getBoundingClientRect(); return (e.clientX-r.left-ox)/sc; };
  function pd(e){ e.preventDefault(); if (st.mode==="over"){ reset(); st.skip=true; return; } st.aim=lx(e); }
  function pm(e){ if (e.pointerType==="mouse" || e.pressure>0) st.aim=lx(e); }
  function pu(e){ if (st.skip){ st.skip=false; return; } st.aim=lx(e); drop(); }
  function kd(e){
    if (e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){ st.aim=Math.max(0,st.aim-18); e.preventDefault(); }
    else if (e.key==="ArrowRight"||e.key==="d"||e.key==="D"){ st.aim=Math.min(LW,st.aim+18); e.preventDefault(); }
    else if (e.key===" "||e.key==="Enter"||e.key==="ArrowDown"){ e.preventDefault(); if (st.mode==="over") reset(); else drop(); }
  }
  reset(); resize();
  window.addEventListener("resize",resize);
  window.addEventListener("keydown",kd);
  cv.addEventListener("pointerdown",pd);
  cv.addEventListener("pointermove",pm);
  cv.addEventListener("pointerup",pu);
  raf=requestAnimationFrame(frame);
  return () => {
    alive=false; cancelAnimationFrame(raf);
    window.removeEventListener("resize",resize);
    window.removeEventListener("keydown",kd);
    cv.remove();
  };
}

/* =====================================================
   GAME: Sled Rush 3D — loads three.js, falls back to the 2D version
   ===================================================== */
function loadThree(){
  return new Promise((ok,fail)=>{
    if (window.THREE) return ok();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
    s.onload=()=>window.THREE?ok():fail(); s.onerror=fail;
    document.head.appendChild(s);
  });
}
function sledRush(stage){
  let stop=null, cancelled=false;
  const note=document.createElement("div");
  note.textContent="Loading…"; note.style.cssText="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8d98c7";
  stage.appendChild(note);
  const start=fn=>{ if(cancelled)return; note.remove(); stop=fn(stage); };
  loadThree().then(()=>{ try{ start(sledRush3D); }catch(e){ stage.innerHTML=""; start(sledRush2D); } })
             .catch(()=>start(sledRush2D));
  return ()=>{ cancelled=true; note.remove(); if(stop)stop(); };
}
function sledRush3D(stage){
  const T=THREE;
  const renderer=new T.WebGLRenderer({antialias:true});
  const cv=renderer.domElement; stage.appendChild(cv);
  const hud=document.createElement("div");
  hud.style.cssText="position:absolute;inset:0;pointer-events:none;font-family:system-ui,sans-serif;color:#0d2440";
  hud.innerHTML='<div class="sc" style="position:absolute;left:16px;top:10px;font-weight:800;font-size:26px"></div>'+
    '<div class="bs" style="position:absolute;right:16px;top:16px;font-weight:700;font-size:13px"></div>'+
    '<div class="ms" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(8,16,40,.55);color:#fff;text-align:center;padding:20px"></div>';
  stage.appendChild(hud);
  const elS=hud.querySelector(".sc"), elB=hud.querySelector(".bs"), elM=hud.querySelector(".ms");

  const scene=new T.Scene();
  scene.background=new T.Color(0xbfe3fb);
  scene.fog=new T.Fog(0xe4f3ff,45,155);
  const camera=new T.PerspectiveCamera(62,1,.1,240);
  scene.add(new T.HemisphereLight(0xffffff,0x9fc3e6,.95));
  const sun=new T.DirectionalLight(0xffffff,.55); sun.position.set(6,12,5); scene.add(sun);

  const mat=c=>new T.MeshLambertMaterial({color:c});
  const M={snow:mat(0xf6fbff),white:mat(0xffffff),green:mat(0x1f7a4a),green2:mat(0x2b8f5a),trunk:mat(0x6b4a2b),rock:mat(0x76828f),
           red:mat(0xe03131),gold:mat(0xffd43b),blue:mat(0x1c5fd4),skin:mat(0xffd8b5),ice:mat(0x74c7ff),dark:mat(0x39424f),bump:mat(0xd3e8f7),wood:mat(0x7a5230),chasm:mat(0x24405c),deep:mat(0x12263a)};
  const mesh=(g,m,x,y,z)=>{ const o=new T.Mesh(g,m); o.position.set(x||0,y||0,z||0); return o; };

  const ground=mesh(new T.PlaneGeometry(600,600),M.snow); ground.rotation.x=-Math.PI/2; scene.add(ground);

  // shared geometry
  const G={trunk:new T.CylinderGeometry(.25,.32,1.2,6),c1:new T.ConeGeometry(1.7,2.2,7),c2:new T.ConeGeometry(1.3,1.9,7),c3:new T.ConeGeometry(.9,1.6,7),
           cap:new T.ConeGeometry(.5,.7,7),rock:new T.DodecahedronGeometry(1,0),box:new T.BoxGeometry(1,1,1),ball:new T.SphereGeometry(1,10,8)};
  function tree(s){
    const g=new T.Group();
    g.add(mesh(G.trunk,M.trunk,0,.6,0),mesh(G.c1,M.green,0,2.1,0),mesh(G.c2,M.green2,0,3.3,0),mesh(G.c3,M.green,0,4.4,0),mesh(G.cap,M.white,0,5.1,0));
    g.scale.setScalar(s||1); return g;
  }
  function rock(){
    const g=new T.Group(), r=mesh(G.rock,M.rock,0,.5,0); r.scale.set(1.25,.8,1.05); r.rotation.y=Math.random()*6;
    const c=mesh(G.ball,M.white,0,1.02,0); c.scale.set(.75,.22,.65);
    g.add(r,c); return g;
  }
  function gift(){
    const g=new T.Group(), b=mesh(G.box,M.red,0,0,0);
    const r1=mesh(G.box,M.gold,0,0,0); r1.scale.set(1.04,1.04,.22);
    const r2=mesh(G.box,M.gold,0,0,0); r2.scale.set(.22,1.04,1.04);
    g.add(b,r1,r2); return g;
  }
  function ramp(){
    const r=mesh(G.box,M.ice,0,.72,0); r.scale.set(3.6,.3,4.6); r.rotation.x=-.3;
    const g=new T.Group(); g.add(r); return g;
  }
  // a ravine crossing the hill with one snow-covered wooden bridge over it
  const BL=26;
  function bridge(x){
    const g=new T.Group(), bx=(m,sx,sy,sz,px,py,pz)=>{ const o=mesh(G.box,m,px,py,pz); o.scale.set(sx,sy,sz); g.add(o); };
    bx(M.chasm,600,.02,BL,0,.02,-BL/2);
    bx(M.deep,600,.02,BL-8,0,.03,-BL/2);
    bx(M.white,600,.3,.7,0,.08,0); bx(M.white,600,.3,.7,0,.08,-BL);
    bx(M.wood,5.4,.3,BL+2,x,-.1,-BL/2);
    bx(M.white,4.8,.08,BL+2,x,.08,-BL/2);
    for(const s of [-1,1]){
      const rx=x+s*2.65;
      for(let i=0;i<=8;i++) bx(M.wood,.2,1.1,.2,rx,.55,1-i*(BL+2)/8);
      bx(M.wood,.14,.14,BL+2,rx,1.05,-BL/2);
      bx(M.white,.26,.1,BL+2,rx,1.17,-BL/2);
      bx(M.dark,.12,3.4,.12,rx,1.7,1.2);
      bx(M.red,1,.55,.06,rx+s*.5,3.1,1.2);
    }
    return g;
  }
  // sled + rider
  const sled=new T.Group();
  (function(){
    const base=mesh(G.box,M.red,0,.38,0); base.scale.set(1.1,.14,2);
    const r1=mesh(G.box,M.dark,-.45,.1,0); r1.scale.set(.1,.1,2.2);
    const r2=mesh(G.box,M.dark,.45,.1,0); r2.scale.set(.1,.1,2.2);
    const body=mesh(G.box,M.blue,0,.95,.25); body.scale.set(.75,.9,.6);
    const legs=mesh(G.box,M.dark,0,.55,-.35); legs.scale.set(.7,.25,.9);
    const head=mesh(G.ball,M.skin,0,1.65,.25); head.scale.setScalar(.3);
    const hat=mesh(G.ball,M.gold,0,1.8,.25); hat.scale.set(.31,.2,.31);
    sled.add(base,r1,r2,body,legs,head,hat);
  })();
  scene.add(sled);

  // scenery: forest on both sides + snow bumps on the track for a sense of speed
  const SPAN=175, side=[], bumps=[];
  for(let i=0;i<70;i++){
    const t=tree(.9+Math.random()*.9), s=i%2?1:-1;
    t.position.set(s*(11+Math.random()*26),0,-Math.random()*SPAN); scene.add(t); side.push(t);
  }
  for(let i=0;i<70;i++){
    const b=mesh(G.ball,M.bump,(Math.random()*2-1)*9.5,0,-Math.random()*SPAN); b.scale.set(.5+Math.random()*.6,.07,.5+Math.random()*.6);
    scene.add(b); bumps.push(b);
  }
  // falling snow
  const NF=260, fp=new Float32Array(NF*3);
  for(let i=0;i<NF;i++){ fp[i*3]=(Math.random()*2-1)*20; fp[i*3+1]=Math.random()*14; fp[i*3+2]=-Math.random()*40; }
  const fgeo=new T.BufferGeometry(); fgeo.setAttribute("position",new T.BufferAttribute(fp,3));
  const flakes=new T.Points(fgeo,new T.PointsMaterial({color:0xffffff,size:.14,transparent:true,opacity:.9}));
  scene.add(flakes);

  let W=0,H=0,raf=0,last=0,alive=true,st,best=0,shown="";
  try{ best=+localStorage.getItem("sledrush_best")||0; }catch(e){}
  const score=()=>Math.floor(st.dist/3)+st.bonus;

  function reset(){
    if(st){ for(const o of st.objs) scene.remove(o.m); for(const b of st.bridges) scene.remove(b.g); }
    st={mode:"ready",x:0,vx:0,dir:0,y:0,vy:0,z:0,speed:24,dist:0,bonus:0,next:30,objs:[],spin:0,bridges:[],nextBridge:200,fall:false};
    sled.rotation.set(0,0,0);
    for(const t of side) t.position.z=-Math.random()*SPAN;
    for(const b of bumps) b.position.z=-Math.random()*SPAN;
  }
  function resize(){
    const r=stage.getBoundingClientRect(); W=r.width; H=r.height;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    renderer.setSize(W,H,false);
    camera.aspect=W/Math.max(1,H); camera.fov = W<H ? 72 : 60; camera.updateProjectionMatrix();
  }
  function put(t,x,z,y){
    const m = t==="tree"?tree(1) : t==="rock"?rock() : t==="gift"?gift() : ramp();
    m.position.set(x,y||0,z); scene.add(m);
    st.objs.push({m,t,x,z,y:y||0,hit:false});
  }
  function spawn(){
    const z=st.z-150, n=(st.speed>40?2:1)+(Math.random()<.5?1:0), used=[];
    for(let i=0;i<n;i++){
      let x, tries=0;
      do{ x=(Math.random()*2-1)*7.5; }while(used.some(u=>Math.abs(u-x)<3.2) && ++tries<8);
      used.push(x);
      const r=Math.random();
      if(r<.13) put("gift",x,z,.7);
      else if(r<.24){ put("ramp",x,z); put("gift",x,z-17,2.9); }
      else if(r<.47) put("rock",x,z);
      else put("tree",x,z);
    }
  }
  function crash(){
    st.mode="over";
    if(score()>best){ best=score(); try{localStorage.setItem("sledrush_best",best);}catch(e){} }
  }
  function update(dt){
    st.vx+=(st.dir*12-st.vx)*Math.min(1,dt*8);
    if(st.mode!=="over") st.x=Math.max(-8.5,Math.min(8.5,st.x+st.vx*dt));
    if(st.mode==="play"){
      st.speed=Math.min(62,st.speed+dt*.9);
      const dz=st.speed*dt; st.z-=dz; st.dist+=dz;
      st.vy-=30*dt; st.y+=st.vy*dt; if(st.y<=0){ st.y=0; st.vy=0; }
      st.next-=dz; st.nextBridge-=dz;
      if(st.next<=0){
        if(st.nextBridge<=0){
          const b={x:(Math.random()*2-1)*5,z0:st.z-168,on:false}; b.z1=b.z0-BL;
          b.g=bridge(b.x); b.g.position.z=b.z0; scene.add(b.g); st.bridges.push(b);
          st.nextBridge=320+Math.random()*220; st.next=60;
        } else { spawn(); st.next=Math.max(10,22-st.speed*.17)*(.7+Math.random()*.6); }
      }
      for(const b of st.bridges){
        if(st.z<=b.z0 && st.z>=b.z1 && st.y<.3){
          if(b.on) st.x=Math.max(b.x-2,Math.min(b.x+2,st.x));
          else if(Math.abs(st.x-b.x)<2.4) b.on=true;
          else { st.fall=true; crash(); }
        }
      }
      st.bridges=st.bridges.filter(b=>{ if(b.z1>st.z+12){ scene.remove(b.g); return false; } return true; });
      for(const o of st.objs){
        if(o.t==="gift") o.m.rotation.y+=dt*2.5;
        if(o.hit || o.z<st.z-1) continue;
        o.hit=true;
        const dx=Math.abs(o.x-st.x);
        if(o.t==="tree"){ if(dx<1.15) crash(); }
        else if(o.t==="rock"){ if(dx<1.35 && st.y<1) crash(); }
        else if(o.t==="ramp"){ if(dx<2 && st.y<.15) st.vy=11.5; }
        else if(dx<1.4 && Math.abs(st.y+.7-o.y)<1.8){ st.bonus+=50; o.z=1e9; scene.remove(o.m); }
      }
      st.objs=st.objs.filter(o=>{ if(o.z>st.z+8){ scene.remove(o.m); return false; } return true; });
    } else if(st.mode==="over"){
      st.spin=Math.min(1,st.spin+dt*4);
      if(st.fall) st.y=Math.max(-9,st.y-dt*14);
    }
    const inGap=z=>st.bridges.some(b=>z<b.z0+.5&&z>b.z1-.5);
    for(const t of side) t.visible=!inGap(t.position.z);
    for(const b of bumps) b.visible=!inGap(b.position.z);
    // recycle scenery
    for(const t of side) if(t.position.z>st.z+10){ t.position.z-=SPAN; t.position.x=(t.position.x<0?-1:1)*(11+Math.random()*26); }
    for(const b of bumps) if(b.position.z>st.z+6){ b.position.z-=SPAN; b.position.x=(Math.random()*2-1)*9.5; }
    ground.position.z=st.z-120;
    // snow
    const fall=dt*(3+(st.mode==="play"?st.speed*.15:0));
    for(let i=0;i<NF;i++){ fp[i*3+1]-=fall*(.6+(i%5)*.12); if(fp[i*3+1]<0){ fp[i*3+1]=14; fp[i*3]=(Math.random()*2-1)*20; } }
    fgeo.attributes.position.needsUpdate=true;
    flakes.position.set(st.x*.8,0,st.z+6);
    // sled + camera
    sled.position.set(st.x,st.y,st.z);
    sled.rotation.z=-st.vx*.03 + st.spin*1.3;
    sled.rotation.y=-st.vx*.03;
    sled.rotation.x=st.y>0 ? Math.max(-.3,Math.min(.3,st.vy*.02)) : 0;
    const cy=Math.max(0,st.y);
    camera.position.set(st.x*.8,3.5+cy*.55,st.z+7.5);
    camera.lookAt(st.x*.9,1+cy*.5,st.z-10);
  }
  function hudUpdate(){
    const key=st.mode+"|"+score()+"|"+best;
    if(key===shown) return; shown=key;
    elS.textContent=score(); elB.textContent="BEST "+best;
    if(st.mode==="play"){ elM.style.display="none"; return; }
    elM.style.display="flex";
    elM.innerHTML = st.mode==="over"
      ? '<div style="font-size:34px;font-weight:800">'+(st.fall?'Into the ravine!':'Wipeout!')+'</div><div>Score '+score()+' · Best '+best+'</div><div>Tap or press Space to ride again</div>'
      : '<div style="font-size:34px;font-weight:800">Sled Rush 3D</div><div>Tap or press Space to start</div>'+
        '<div style="font-size:13px;color:#b8c8ee">Steer: hold the left or right side of the screen, or ← → / A D<br>Dodge trees and rocks. Hit ice ramps to jump. Gifts are +50.<br>Steer onto the snowy bridges (red flags) to cross the ravines.</div>';
  }
  function frame(t){
    if(!alive) return;
    const dt=Math.min(.05,(t-last)/1000||0); last=t;
    update(dt); hudUpdate(); renderer.render(scene,camera);
    raf=requestAnimationFrame(frame);
  }
  function action(){ if(st.mode==="ready") st.mode="play"; else if(st.mode==="over"&&st.spin>=1){ reset(); st.mode="play"; } }
  const keys={};
  const setDir=()=>{ st.dir=(keys.r?1:0)-(keys.l?1:0); };
  function kd(e){
    const k=e.key.toLowerCase();
    if(k==="arrowleft"||k==="a"){ keys.l=true; setDir(); e.preventDefault(); }
    else if(k==="arrowright"||k==="d"){ keys.r=true; setDir(); e.preventDefault(); }
    else if(k===" "||k==="enter"){ action(); e.preventDefault(); }
  }
  function ku(e){
    const k=e.key.toLowerCase();
    if(k==="arrowleft"||k==="a"){ keys.l=false; setDir(); }
    else if(k==="arrowright"||k==="d"){ keys.r=false; setDir(); }
  }
  const sideOf=e=>{ const r=cv.getBoundingClientRect(); return (e.clientX-r.left)<r.width/2?-1:1; };
  let down=false;
  function pd(e){ e.preventDefault(); if(st.mode!=="play"){ action(); return; } down=true; st.dir=sideOf(e); }
  function pm(e){ if(down&&st.mode==="play") st.dir=sideOf(e); }
  function pu(){ down=false; setDir(); }

  reset(); resize();
  window.addEventListener("resize",resize);
  window.addEventListener("keydown",kd);
  window.addEventListener("keyup",ku);
  cv.addEventListener("pointerdown",pd);
  cv.addEventListener("pointermove",pm);
  cv.addEventListener("pointerup",pu);
  cv.addEventListener("pointercancel",pu);
  raf=requestAnimationFrame(frame);
  return ()=>{
    alive=false; cancelAnimationFrame(raf);
    window.removeEventListener("resize",resize);
    window.removeEventListener("keydown",kd);
    window.removeEventListener("keyup",ku);
    renderer.dispose(); cv.remove(); hud.remove();
  };
}

/* =====================================================
   GAME: Sled Rush 2D — fallback if 3D can't load
   ===================================================== */
function sledRush2D(stage){
  const cv = document.createElement("canvas"); stage.appendChild(cv);
  const ctx = cv.getContext("2d");
  let W=0,H=0,raf=0,last=0,alive=true;
  const D=14, FAR=130;
  let st, best=0;
  try{ best = +localStorage.getItem("sledrush_best") || 0; }catch(e){}

  function reset(){
    st = { mode:"ready", x:0, vx:0, dir:0, speed:24, dist:0, bonus:0, nextSpawn:20, objs:[], flakes:[] };
    for(let i=0;i<60;i++) st.flakes.push({x:Math.random(),y:Math.random(),s:.3+Math.random()*.7});
  }
  function resize(){
    const r = stage.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio||1, 2);
    W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  const score = () => Math.floor(st.dist/3) + st.bonus;

  function spawn(){
    const n = st.speed > 40 && Math.random()<.45 ? 2 : 1;
    for(let i=0;i<n;i++){
      const r = Math.random();
      st.objs.push({ x:(Math.random()*2-1)*1.1, z:FAR, t: r<.16 ? "gift" : r<.4 ? "rock" : "tree", hit:false });
    }
  }
  function update(dt){
    // steering
    st.vx += (st.dir*2.2 - st.vx) * Math.min(1, dt*9);
    st.x = Math.max(-1.1, Math.min(1.1, st.x + st.vx*dt));
    if (st.mode!=="play") return;
    st.speed = Math.min(70, st.speed + dt*0.9);
    const move = st.speed*dt;
    st.dist += move;
    st.nextSpawn -= move;
    if (st.nextSpawn<=0){ spawn(); st.nextSpawn = Math.max(9, 22 - st.speed*0.17) * (0.7+Math.random()*0.6); }
    for (const o of st.objs){
      const was = o.z; o.z -= move;
      if (!o.hit && was>0 && o.z<=0){
        o.hit = true;
        const r = o.t==="gift" ? .2 : o.t==="tree" ? .15 : .14;
        if (Math.abs(o.x - st.x) < r){
          if (o.t==="gift"){ st.bonus += 50; o.z = -99; }
          else { st.mode="over"; if (score()>best){ best=score(); try{localStorage.setItem("sledrush_best",best);}catch(e){} } }
        }
      }
    }
    st.objs = st.objs.filter(o => o.z > -5);
  }

  function proj(x,z){
    const hz=H*0.36, py=H*0.84, half=Math.min(W*0.42,380), s=D/(D+z);
    return { x: W/2 + x*half*s, y: hz + (py-hz)*s, s };
  }
  function draw(){
    const hz=H*0.36;
    // sky
    let g = ctx.createLinearGradient(0,0,0,hz);
    g.addColorStop(0,"#2b6fd6"); g.addColorStop(1,"#bfe6ff");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,hz+1);
    // mountains
    ctx.fillStyle="#9cc6ea";
    ctx.beginPath(); ctx.moveTo(0,hz);
    for(let i=0;i<=8;i++){ ctx.lineTo(W*i/8, hz - (i%2 ? H*0.11 : H*0.04) - (i%3)*H*0.015); }
    ctx.lineTo(W,hz); ctx.fill();
    // snow
    g = ctx.createLinearGradient(0,hz,0,H);
    g.addColorStop(0,"#dff1ff"); g.addColorStop(1,"#ffffff");
    ctx.fillStyle=g; ctx.fillRect(0,hz,W,H-hz);
    // track
    const a=proj(-1.3,FAR), b=proj(1.3,FAR), c=proj(1.3,-4), d=proj(-1.3,-4);
    ctx.fillStyle="#eef8ff";
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.lineTo(c.x,c.y); ctx.lineTo(d.x,d.y); ctx.fill();
    // edge markers (speed feel)
    ctx.fillStyle="#b5d6ee";
    for (let k=0;k<14;k++){
      const z = k*10 - (st.dist%10);
      for (const side of [-1.3,1.3]){
        const p = proj(side,z);
        ctx.beginPath(); ctx.ellipse(p.x,p.y, 16*p.s, 5*p.s, 0,0,7); ctx.fill();
      }
    }
    // objects far → near
    const objs = st.objs.slice().sort((p,q)=>q.z-p.z);
    let drewSled=false;
    for (const o of objs){
      if (!drewSled && o.z<=0){ sled(); drewSled=true; }
      const p = proj(o.x,o.z), u = H*0.2*p.s;
      ctx.globalAlpha = Math.min(1, (FAR-o.z)/25);
      ctx.fillStyle="rgba(120,160,200,.35)";
      ctx.beginPath(); ctx.ellipse(p.x,p.y,u*.45,u*.1,0,0,7); ctx.fill();
      if (o.t==="tree"){
        ctx.fillStyle="#6b4a2b"; ctx.fillRect(p.x-u*.06,p.y-u*.25,u*.12,u*.25);
        for (let i=0;i<3;i++){
          const w=u*(.42-i*.1), y0=p.y-u*(.2+i*.3);
          ctx.fillStyle="#1f7a4a"; tri(p.x,y0-u*.45,w,u*.45);
          ctx.fillStyle="#fff"; tri(p.x,y0-u*.45,w*.45,u*.2);
        }
      } else if (o.t==="rock"){
        ctx.fillStyle="#6f7b8a";
        ctx.beginPath(); ctx.moveTo(p.x-u*.34,p.y); ctx.lineTo(p.x-u*.2,p.y-u*.28); ctx.lineTo(p.x+u*.08,p.y-u*.36); ctx.lineTo(p.x+u*.34,p.y-u*.1); ctx.lineTo(p.x+u*.3,p.y); ctx.fill();
        ctx.fillStyle="#fff";
        ctx.beginPath(); ctx.moveTo(p.x-u*.2,p.y-u*.28); ctx.lineTo(p.x+u*.08,p.y-u*.36); ctx.lineTo(p.x+u*.18,p.y-u*.25); ctx.lineTo(p.x-u*.1,p.y-u*.2); ctx.fill();
      } else {
        const s2=u*.3;
        ctx.fillStyle="#ff4d6d"; ctx.fillRect(p.x-s2/2,p.y-s2,s2,s2);
        ctx.fillStyle="#ffd43b"; ctx.fillRect(p.x-s2*.1,p.y-s2,s2*.2,s2); ctx.fillRect(p.x-s2/2,p.y-s2*.6,s2,s2*.2);
      }
      ctx.globalAlpha=1;
    }
    if (!drewSled) sled();

    // snowflakes
    ctx.fillStyle="rgba(255,255,255,.85)";
    for (const f of st.flakes){ ctx.beginPath(); ctx.arc(f.x*W,f.y*H,1.2+f.s*1.6,0,7); ctx.fill(); }

    // HUD
    ctx.fillStyle="#0d2440"; ctx.font="700 22px system-ui,sans-serif"; ctx.textAlign="left";
    ctx.fillText(score(), 16, 32);
    ctx.font="600 13px system-ui,sans-serif"; ctx.textAlign="right";
    ctx.fillText("BEST "+best, W-16, 30);

    if (st.mode!=="play"){
      ctx.fillStyle="rgba(8,16,40,.55)"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle="#fff"; ctx.textAlign="center";
      ctx.font="800 34px system-ui,sans-serif";
      ctx.fillText(st.mode==="over" ? "Wipeout!" : "Sled Rush", W/2, H*0.4);
      ctx.font="500 16px system-ui,sans-serif";
      if (st.mode==="over") ctx.fillText("Score "+score()+"   ·   Best "+best, W/2, H*0.4+34);
      ctx.fillText(st.mode==="over" ? "Tap or press Space to ride again" : "Tap or press Space to start", W/2, H*0.4+66);
      ctx.fillStyle="#b8c8ee"; ctx.font="500 13px system-ui,sans-serif";
      ctx.fillText("Steer: hold left / right side of screen, or ← → / A D", W/2, H*0.4+94);
      ctx.fillText("Dodge trees and rocks. Grab gifts for +50.", W/2, H*0.4+114);
    }
  }
  function tri(x,y,w,h){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x-w,y+h); ctx.fill(); }
  function sled(){
    const p = proj(st.x,0), u = H*0.2, tilt = st.vx*0.18;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(tilt);
    ctx.fillStyle="rgba(120,160,200,.4)"; ctx.beginPath(); ctx.ellipse(0,4,u*.3,u*.07,0,0,7); ctx.fill();
    ctx.strokeStyle="#39424f"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-u*.2,0); ctx.lineTo(-u*.2,-u*.1); ctx.moveTo(u*.2,0); ctx.lineTo(u*.2,-u*.1); ctx.stroke();
    ctx.fillStyle="#e03131"; rr(-u*.26,-u*.2,u*.52,u*.12,6);
    ctx.fillStyle="#1c5fd4"; rr(-u*.14,-u*.48,u*.28,u*.3,8);      // jacket
    ctx.fillStyle="#ffd8b5"; ctx.beginPath(); ctx.arc(0,-u*.56,u*.09,0,7); ctx.fill();
    ctx.fillStyle="#ffb703"; ctx.beginPath(); ctx.arc(0,-u*.6,u*.095,Math.PI,0); ctx.fill(); // hat
    ctx.restore();
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.fill(); }

  function frame(t){
    if (!alive) return;
    const dt = Math.min(.05, (t-last)/1000 || 0); last=t;
    update(dt);
    const fs = st.mode==="play" ? st.speed/60 : .15;
    for (const f of st.flakes){ f.y += dt*f.s*(.25+fs); f.x -= st.vx*dt*.05; if (f.y>1){f.y=0;f.x=Math.random();} if(f.x<0)f.x+=1; if(f.x>1)f.x-=1; }
    draw();
    raf = requestAnimationFrame(frame);
  }
  function action(){ if (st.mode==="ready") st.mode="play"; else if (st.mode==="over"){ reset(); st.mode="play"; } }

  const keys = {};
  function setDir(){ st.dir = (keys.r?1:0) - (keys.l?1:0); }
  function kd(e){
    if (e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){ keys.l=true; setDir(); e.preventDefault(); }
    else if (e.key==="ArrowRight"||e.key==="d"||e.key==="D"){ keys.r=true; setDir(); e.preventDefault(); }
    else if (e.key===" "||e.key==="Enter"){ action(); e.preventDefault(); }
  }
  function ku(e){
    if (e.key==="ArrowLeft"||e.key==="a"||e.key==="A"){ keys.l=false; setDir(); }
    else if (e.key==="ArrowRight"||e.key==="d"||e.key==="D"){ keys.r=false; setDir(); }
  }
  function pd(e){
    e.preventDefault();
    if (st.mode!=="play"){ action(); return; }
    const r = cv.getBoundingClientRect();
    st.dir = (e.clientX - r.left) < r.width/2 ? -1 : 1;
  }
  function pm(e){
    if (st.mode!=="play" || !e.buttons && e.pointerType==="mouse") return;
    const r = cv.getBoundingClientRect();
    if (e.pressure>0 || e.pointerType==="touch") st.dir = (e.clientX - r.left) < r.width/2 ? -1 : 1;
  }
  function pu(){ st.dir = 0; setDir(); }

  reset(); resize();
  window.addEventListener("resize",resize);
  window.addEventListener("keydown",kd);
  window.addEventListener("keyup",ku);
  cv.addEventListener("pointerdown",pd);
  cv.addEventListener("pointermove",pm);
  cv.addEventListener("pointerup",pu);
  cv.addEventListener("pointercancel",pu);
  cv.addEventListener("pointerleave",pu);
  raf = requestAnimationFrame(frame);

  return () => {
    alive=false; cancelAnimationFrame(raf);
    window.removeEventListener("resize",resize);
    window.removeEventListener("keydown",kd);
    window.removeEventListener("keyup",ku);
    cv.remove();
  };
}
</script>
